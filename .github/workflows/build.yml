# Build the Yuki Windows installer: PyInstaller onedir -> (sign) -> Inno Setup -> (sign) -> artifact / release.
#
# Signing uses Azure Artifact Signing (formerly Trusted Signing). It runs only when the secrets exist;
# without them the build still produces an unsigned installer. Secrets to add in the repo settings:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET       (an app registration with the
#                                                                 "Artifact Signing Certificate Profile Signer" role)
#   AZURE_SIGNING_ENDPOINT        e.g. https://eus.codesigning.azure.net/
#   AZURE_SIGNING_ACCOUNT         the Artifact Signing account name
#   AZURE_SIGNING_PROFILE         the certificate profile name
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "yuki/**", "pyproject.toml", "uv.lock", ".github/workflows/build.yml"]

permissions:
  contents: write     # the release step on tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies (locked, with the build group)
        run: |
          uv python install 3.13
          uv sync --frozen --group build

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (uv run --frozen python -c "import yuki; print(yuki.__version__)").Trim()
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup (if the image lacks it)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build onedir + offline self-check
        shell: pwsh
        run: packaging\build.ps1 -Python .venv\Scripts\python.exe -Version ${{ steps.version.outputs.value }} -SkipInstaller

      - name: Sign the executables
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\dist\Yuki
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: packaging\build.ps1 -Python .venv\Scripts\python.exe -Version ${{ steps.version.outputs.value }} -InstallerOnly

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\Output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YukiSetup-${{ steps.version.outputs.value }}
          path: packaging/Output/YukiSetup-*.exe
          if-no-files-found: error

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/YukiSetup-*.exe
