# WhatsApp: its own data for the `message` capability (message.toml) (phase L design §6; PLAN.md D0, D17, D19, Q3/rule
# 8). Driver data only: true for anyone's WhatsApp; whom the user messages there is learned, never written here.
#
# A chat whose stored handle is a phone number opens by WhatsApp's own link (whatsapp://send?phone=...); any other
# chat through WhatsApp's chat search: its search shortcut, the chat's name as memory keeps it, then the result row
# picked by the keyed digest of that name (never a title match). Both are unverified until the first live run (the
# search shortcut and the result list's roles below are WhatsApp's, kept as data so a change is a data change). The chat
# is checked open by memory's encrypted thread ids before anything is typed. Never with a game in front.
#
# Zero setup (D0): WhatsApp's own window, shortcuts and whatsapp:// links; nothing to link, no API.

[connection]
app = "whatsapp"

[chat]
title = "WhatsApp"
# the desktop app's programs (the current build runs as WhatsApp.Root.exe; an older one as WhatsApp.exe)
images = ["WhatsApp.Root.exe", "WhatsApp.exe"]
processes = ["whatsapp.root", "whatsapp"]
services = ["web.whatsapp.com", "whatsapp.root", "whatsapp"]
# its chat search (only ever sent into WhatsApp's own window, with no game in front)
search = ["ctrl", "f"]
send = ["enter"]
# select everything in the message box (a draft Yuki typed there itself is typed over, never the user's:
# yuki/skills/chat.py typed_by_yuki)
select_all = ["ctrl", "a"]

# A chat's stored handle as a phone number (digits, an optional leading +; checked in code) -> WhatsApp's own link.
[chat.phone]
uri = "whatsapp://send?phone={phone}"

# The search result row: picked by the keyed digest of the chat's name inside the result list.
[chat.pick]
role = "ListItem"
box_role = "List"
