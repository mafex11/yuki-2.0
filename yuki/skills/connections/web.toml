# web.open_page and web.open_video: a web page, or one picked video, in a browser (phase L design §6, §4.4-§4.5;
# PLAN.md D0, D16, D17, D19). Capabilities: what any user's browser can do. Which sites and pages the user opens, in
# which browser and when, are learned (moments of kind page, the timeline), never written here.
#
# The site: a site file's name (yuki/connect/sites/<site>.toml: its documented URL shapes, the page kinds and their
# addresses) or a registrable domain (a host-scope page: its front page, https://<domain>/). The page: one of that
# site's page kinds (a channel page, a watch page); none is the site's front page. The page's own value is the item: a
# name (a channel's handle) from the user's words or an offered option; an opaque id (a template value named "id": a
# video's, a channel's) only from an offered option's link (phase T), never from words and never guessed. The address
# is a launch argument (nothing typed). After "open YouTube" nothing plays until the user picks; when they ask Yuki to
# choose ("a video I like", "put something on": slots choose = true and context, contract C2; audit 17 Oct decision
# 2), Yuki plays its own pick from their taste (yuki/skills/taste.py choose, through yuki/skills/engine.py), names it
# and why, and "another one" takes the next. Never with a game in front or in a call (said so instead).
#
# The browser is a means, with no ranked rule shipped (design §5, critique M8): the browser the caller gave (the
# model's reading of the whole exchange; kw3, 20 Oct: a browser name found in the turns never overrides it and is never
# asked about), else their usual (preference web.open_page:browser@<site>, or the learned skill's fill policy), else the
# browser they use most, else Windows' default handler. "A browser" is measured,
# never a list: a program whose timeline rows carried pages of at least 3 hosts (yuki/skills/web_route.py). Never with
# a game in front ("after the round?").
#
# The ladder (x8WebArc, 10 Oct: Arc ignored every address its alias carried): the address as a launch argument (a
# packaged browser by protocol activation); a browser that kept the page it had did not open it, so the address-bar
# rung runs (in that browser's own window: a new tab, the address typed into the browser's own address field and read
# back, Enter); when neither got there, the hand-off. Each rung's done-check reads the browser window it acted in.
#
# Zero setup (D0): nothing to connect, no API; the browser's own window.

[connection]
app = "web"

[capability."web.open_page"]
end = "page"
kind = "open"
menu = "open a site's front page or one of its pages in a browser; nothing plays unless choose=true"
# lb B4 (final-H2 youtube_channel_deji_arc): both routes below say their own line, and a page of a site that takes a
# name (a channel's handle page) names that item ("Deji's page on Youtube is up.": web_route LINE_ITEM_UP), so a wrong
# one is heard and one "not that" fixes it; this template is only the fallback for a route that says none.
done_line = "{site} is up."
offer_class = "judged"
handoff = true
serves = [{ end = "page", target = "page", needs = "browser" }]
bind = { site = "site", page = "page", item = "entity", browser = "app" }

# A site file's name or a registrable domain, as the user said it (a learned skill binds it).
[[capability."web.open_page".slot]]
name = "site"
type = "text"
role = "key"
required = true
ask = "Which site?"

# One of the site file's page kinds; none: the site's front page.
[[capability."web.open_page".slot]]
name = "page"
type = "text"
role = "key"

# The page's own value: a name (a channel's handle) from the user's words or an offered option; an id (a video's, a
# channel's) only from an offered option's link (web_route.page_address).
[[capability."web.open_page".slot]]
name = "item"
type = "entity"
role = "fill"

[[capability."web.open_page".slot]]
name = "browser"
type = "app"
role = "means"
scope = "site"
say = "in {browser}"

[[capability."web.open_page".route]]
rung = "A"
variant = "browser"
via = "driver"
driver = "web_route"
call = "open_page"
needs_focus = true
means = "browser"
# the browser window it opened the page in shows it (by template value, or by host for a host-scope page). fSkills (live
# 18 Oct): a window that showed the same address before counts by its selected tab's identity (another tab selected
# now: the page opened; read before the open). skill20 (final-D: Chrome exposed its background tabs' pages, and the
# first Documents read as the page shown said "other page" on good opens): the window's main page is read by the
# rungs' own page-only reader, which leaves background tabs out; its Documents only when no main page reads
done = { probe = "driver", driver = "web_route", call = "page_shown", within_s = 6 }
# the watcher's own read of that window (memory's Now board), a second source; skill20: only a read taken after the
# done verdict, of that very window, with an address, counts (an older or empty read is no contradiction)
recheck = { probe = "driver", driver = "web_route", call = "page_seen", after_s = 3 }

# x8WebArc: the rung before it didn't open the page (the browser kept the page it had, or another page shows): in the
# chosen browser's own window (by hwnd), a new tab (new_tab: the keys every desktop browser opens one with, its address
# field focused; in Arc they open its command bar, which takes an address the same way: the path that worked on 5 Oct),
# the address typed only into a text field of the browser's own frame (never a page's own box, so never a send) and read
# back, then Enter as navigation.
[[capability."web.open_page".route]]
rung = "A"
variant = "address_bar"
via = "driver"
driver = "web_route"
call = "address_bar"
needs_focus = true
means = "browser"
args = { opens = "page", new_tab = ["ctrl", "t"] }
done = { probe = "driver", driver = "web_route", call = "page_shown", within_s = 6 }
recheck = { probe = "driver", driver = "web_route", call = "page_seen", after_s = 3 }

[capability."web.open_video"]
end = "media_play"
kind = "change"
menu = "play a video they named, or Yuki's pick from their taste (choose=true, context=their words)"
done_line = "Playing it."
offer_class = "never"
handoff = true

# The picked video: one of the offered options (phase T gives them with their link); a channel of theirs given alone
# as the video ("Deji's new video": video = "Deji", that channel's newest unwatched upload, yuki/skills/taste.py choose
# with only=; any longer words, a title or "the one about the island", go the normal way: the thinker finds it); or
# Yuki's own pick when the user asked it to choose (choose = true). No entity kind on purpose: the taste fill never
# guesses a video for a request that asked for none; only a request that asked Yuki to choose plays one nobody named.
# skill20 (final-D B6): a title given with no link is matched by code to one video's own link (the uploads cached from
# their channels' feeds, then the links of the page shown; a string measure, one clear fit only), else as before.
[[capability."web.open_video".slot]]
name = "video"
type = "entity"
role = "fill"
required = true
ask = "Which video?"

[[capability."web.open_video".slot]]
name = "browser"
type = "app"
role = "means"
say = "in {browser}"

[[capability."web.open_video".route]]
rung = "A"
variant = "browser"
via = "driver"
driver = "web_route"
call = "open_video"
needs_focus = true
means = "browser"
when = { slot = "video", field = "ref", has = true }
# Done only when both are seen (review r1 M2): the page in front is that very video's page, and the browser's own media
# session says playing. Autoplay blocked or the tab behind: "couldn't confirm".
[capability."web.open_video".route.done]
probe = "all"
within_s = 6
parts = [
  { probe = "driver", driver = "web_route", call = "video_shown" },
  { probe = "driver", driver = "web_route", call = "video_playing" },
]
# a later re-read: the media session still playing (a source the done-check also read: flagged as such)
[capability."web.open_video".route.recheck]
probe = "driver"
driver = "web_route"
call = "video_playing"
after_s = 4
same_source = true

# x8WebArc: the video's own link typed into the chosen browser's address field when the rung before didn't open it
# (see web.open_page's address-bar rung).
[[capability."web.open_video".route]]
rung = "A"
variant = "address_bar"
via = "driver"
driver = "web_route"
call = "address_bar"
needs_focus = true
means = "browser"
when = { slot = "video", field = "ref", has = true }
args = { opens = "video", new_tab = ["ctrl", "t"] }

[capability."web.open_video".route.done]
probe = "all"
within_s = 6
parts = [
  { probe = "driver", driver = "web_route", call = "video_shown" },
  { probe = "driver", driver = "web_route", call = "video_playing" },
]

[capability."web.open_video".route.recheck]
probe = "driver"
driver = "web_route"
call = "video_playing"
after_s = 4
same_source = true
