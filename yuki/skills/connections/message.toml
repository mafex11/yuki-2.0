# The chat's own web address (critique L4): a chat whose captured address the app's [chat.links] data matches (Slack
# and Discord in a browser) opens at that address in the browser it was last shown in. Opening only: with words to
# type it never runs (typing into a web page is not this route's), so it can never send.
[[capability.message.route]]
rung = "A"
variant = "web_link"
via = "driver"
driver = "web_route"
call = "chat_web_link"
needs_focus = true
means = "browser"
when = { slot = "text", present = false }
done = { probe = "driver", driver = "web_route", call = "chat_page_shown", within_s = 6 }
recheck = { probe = "driver", driver = "web_route", call = "chat_page_shown", after_s = 3, same_source = true }
