# message: open a chat with someone in a chat app, type the user's own words, and send them only when the user plainly
# said so (phase L design §6, §4.4; PLAN.md D0, D17, D19, Q3/rule 8). A capability: what any user's chat apps can do.
# Whom the user messages, in which app and when, are learned (moments of kind message_sent, memory's people index),
# never written here.
#
# One capability for every chat app, as `volume` is one for every volume control. The person (or a group chat or
# channel, by its name) is found in memory's people index (yuki.memory.contacts: named_in, rank_routes); the app is a
# means: the one the user named, else that person's own route as the people index ranks it (their lasting choice
# first, then where they message most lately), filled by the route at run time (fill = "driver"), never a preference
# key and never a default. Each app's own data (its processes, its link and URI shapes, its shortcuts) sits in that
# app's connection file (discord.toml, whatsapp.toml, slack.toml, table [chat]); the routes below only name the app.
#
# Routes, per app (all rung A: the app's own links and shortcuts, D0): a deep link built from the chat's own address
# when the app's link data can build one (discord://, slack://, whatsapp://send?phone=), else the app's quick switcher
# or search; last, a chat whose address is a web page the app's link data matches opens at that address in a browser
# (web_link: the chat only, nothing typed there). Each opens the chat and checks it is open by memory's encrypted
# thread ids or its address (never a window title) before anything is typed. Rule 8 (send rule, lead decision 18 Oct):
# words that message, tell, ask or reply to someone and give what to say ("tell Y X", "send X to Y", "reply to Y
# saying X") send exactly that text, once, after the countdown they can stop (Yuki's own check, the judge, sees the
# send key); naming only the person opens the chat, and asking for a draft types it and leaves it. The talker or the
# planner judges which from their words (send = "send" / "draft"); nothing here lists words. Into a person's own
# direct message only, never a group chat or channel unless they named it. A send is checked by memory's capture of
# the sent message. Never offered (offer_class = "never"). Never with a game in front ("after the round?"). The code
# is yuki/skills/chat.py and yuki/skills/web_route.py.

[connection]
app = "chat"

[capability.message]
end = "message_sent"
kind = "change"
# (the menu line with its slots must fit yuki/skills/connection.py MENU_LINE_CHARS, 140, or the talker sees no slot
# options: 137 with these words)
menu = "message a person, group or chat channel; sends words they gave, a draft if they ask"
done_line = "Done."
commit = "words"
offer_class = "never"
handoff = true
# rule 8: a send is judged as one (the thinker's authorizer) and never retried by a second rung
sends_when = { slot = "send", in = ["send"] }
serves = [{ end = "message_sent", target = "chat", needs = "chat" }]
bind = { person = "contact", app = "app" }

# Whom: a person or a group chat or channel. It stays a text slot (a group chat or channel goes by its name, exactly
# as the user said it), and it is person-bound: `bind` above reads it as a `contact`, so the resolver
# (yuki/skills/resolve.py, failure fix-plan item 6) also accepts the name the talker or the thinker gives when memory's
# people index resolves it to exactly one person whom the user's words name as heard - a misheard form memory learned
# ("hey meant" for Hemanth), a transliteration ("हेमंत") or a close mishearing by sound - and runs it as that
# person's own name. A name two people fit is dropped and asked; a group chat or channel still needs its name said.
# A name the user said that none of their people goes by, but that sounds like exactly one of them, is asked ("Did you
# mean Hemanth?"), never swapped for that person, unless it is a draft or an open and the name is either tight to a
# heard form of theirs the user confirmed ("Kumar" for "quix": that form plus one final consonant) or the user's answer
# to Yuki's own "Who to?" ("to hardish"): then it is that person, and the done line names them. A send is always asked
# first, and after the answer a send to that person is typed and left for them, since whom a message is sent to is
# never matched by sound (yuki/memory/contacts.py sounds_alike, alike_answered; yuki/skills/chat.py find_target,
# _sounds_alike, _send_gate). Each such question is asked once: the same name given again is "I don't know who that
# is".
[[capability.message.slot]]
name = "person"
type = "text"
role = "fill"
required = true
ask = "Who to?"

# The app, only when the user named one: validated against their words by the app's known names (its key, its title
# and programs in the chat data, the names their timeline shows it under: "discord.com" or "Discord.exe" for
# "Discord"), or heard there by sound ("this card" for Discord); with no app given, an app their words name (one of the
# apps these routes drive) fills it. An app they never said is dropped and the person's own route stands. An app with
# no chat data here is a question.
[[capability.message.slot]]
name = "app"
type = "app"
role = "means"
fill = "driver"

# What to write: the user's own words only ("" = just open the chat). A text the talker or the thinker worded that
# their words don't hold is asked about (the engine hands it to the thinker), never dropped to "" and run as an open.
[[capability.message.slot]]
name = "text"
type = "text"
role = "fill"
default = ""
ask = "What should I write?"

# send: their words message, tell, ask or reply to someone and give what to say (sent after the countdown: exactly
# that text, once); draft: they asked for a draft (typed and left for them). Naming only the person gives no text (the
# chat opens). The talker or the planner judges it from their words; the default is a draft.
[[capability.message.slot]]
name = "send"
type = "enum"
role = "fill"
options = ["send", "draft"]
default = "draft"

# Each route's done-check reads what it did (the chat seen open, the words read back, the send captured); its re-check
# reads again live a few seconds later (the same sources: flagged as such).

[[capability.message.route]]
rung = "A"
variant = "discord_link"
via = "driver"
driver = "chat"
call = "open_link"
needs_focus = true
means = "app"
args = { app = "discord" }

[capability.message.route.done]
probe = "driver"
driver = "chat"
call = "message_done"
app = "discord"
person = "{person}"
text = "{text}"
send = "{send}"
within_s = 6

[capability.message.route.recheck]
probe = "driver"
driver = "chat"
call = "message_done"
app = "discord"
person = "{person}"
text = "{text}"
send = "{send}"
live = true
after_s = 3
same_source = true

[[capability.message.route]]
rung = "A"
variant = "discord_switch"
