# Spotify through its own desktop window (phase L design §6; PLAN.md D0, D4). A capability: what any user's Spotify can
# do. Which playlists the user plays, and when, are learned (moments of kind media_context), never written here.
#
# Zero setup: nothing here asks for a developer app, a key or a sign-in. Yuki drives Spotify's own window through UI
# Automation patterns (Invoke, RangeValue, Value), Windows' media session (play only, never a toggle), Spotify's own
# spotify: links it learned from links Spotify showed, and Core Audio. Every label (the slider, the Library grid, the
# row wording "Play {name}" / "Pause {name}", their containers, the link template) is data in one place:
# yuki/connect/sites/spotify.toml. The driver is yuki/skills/spotify_route.py.
#
# The window-state rule: a no-focus Spotify rung may run with a game in front only in the window states the live
# checks proved, kept below as each route's game_states (covered / visible / minimised). None is proven yet, so with a
# game in front a playlist is "after the round?". With no game in front a minimised Spotify may be restored (the
# "restore" route), then the previous window is put back in front. Spotify is never restored, focused, opened by link
# or launched with a game in front (those routes take focus: game = "never").

[connection]
app = "spotify"
state_reader = "spotify_route"

# Shared Spotify data the driver reads (spotify_route.spotify_data()).
[spotify]
# A cold window (Chromium shows only its frame until asked) is warmed within the request's own time, at most this (H2).
request_warm_s = 2.5
# Spotify's session says playing and Spotify.exe has no active render session on this PC for this long: it is playing
# on another device (Spotify Connect); playlist and volume then say so and leave it (M2, Q11's default).
this_pc_s = 2.0
# Arguments Spotify is started with (the launch route; only with no game in front). None: a window started minimised
# (Spotify's own --minimized) never builds its UI Automation tree, so the launch route was cold by design (10 Oct,
# "cold_after_launch"). The driver restores a window that still comes up minimised, then warms it.
launch_args = []

# Whether Spotify's slider and its Windows mixer entry are one control, recorded by the live checks: F live check 1
# (dragging the slider moves the mixer entry) and S-1 (moving the mixer entry moves the slider). Only with both true is
# the mixer a route for "Spotify's own volume" (with a game in front too); until then Spotify's own volume is never set
# through the mixer (M6).
[spotify.mixer]
slider_moves_mixer = false
mixer_moves_slider = false

# -- play a playlist from Your Library, by its name ---------------------------------------------------------------------

[capability."spotify.playlist"]
end = "media_context"
kind = "change"
menu = "play a playlist, album or liked songs from Your Library by name, or choose=true for Yuki's pick"
done_line = "Playing {playlist.name} on Spotify."
offer_class = "everyday"
handoff = true
serves = [{ end = "media_context", target = "playlist", needs = "spotify" }]
bind = { playlist = "entity" }

# The playlist: a fill slot of kind "playlist" (the taste rows spotify_playlist: the user's own picks by hour, learned
# from their moments, plus the Library rows the driver read, listed but never a guess, and what the user called a
# playlist when their words named no row and it then played); a routine is keyed per playlist (routine_key).
# A Library read with no row of the name asked hands over with the slot reported missing and the row names read (RAM
# only), so the thinker picks the user's own playlist from the screen and memory and plays it by steps.
[[capability."spotify.playlist".slot]]
name = "playlist"
type = "entity"
role = "fill"
kind = "playlist"
routine_key = true
required = true
ask = "Which playlist?"

# Rung A, no focus: the row of DataGrid "Your Library" whose name is the one asked; its "Play {name}" button by Invoke.
# "Pause {name}" with the session playing on this PC: already playing. "Pause {name}" with the session paused: the
# session's play. Not while Spotify plays on another device.
[[capability."spotify.playlist".route]]
rung = "A"
variant = "library"
via = "driver"
driver = "spotify_route"
call = "play_library"
needs_focus = false
game = "states"
game_states = []
done = { probe = "driver", driver = "spotify_route", call = "playing_here", name = "{playlist.name}", within_s = 4 }
recheck = { probe = "driver", driver = "spotify_route", call = "still_playing", name = "{playlist.name}", after_s = 4 }

# The window-state rule, no game in front: Spotify minimised and the no-focus route couldn't read or press it.
[[capability."spotify.playlist".route]]
rung = "A"
variant = "restore"
via = "driver"
driver = "spotify_route"
call = "play_restored"
needs_focus = true
done = { probe = "driver", driver = "spotify_route", call = "playing_here", name = "{playlist.name}", within_s = 4 }
recheck = { probe = "driver", driver = "spotify_route", call = "still_playing", name = "{playlist.name}", after_s = 4 }

# Out of view: the spotify:playlist: link Yuki learned for it from a link Spotify showed (brings Spotify forward), then
# the page's own "Play {name}". (The app's own link, so a rung A variant: rung B is the recorded click path, which needs
# a verified run before it may run.)
[[capability."spotify.playlist".route]]
rung = "A"
variant = "link"
via = "driver"
driver = "spotify_route"
call = "play_link"
needs_focus = true
done = { probe = "driver", driver = "spotify_route", call = "playing_here", name = "{playlist.name}", within_s = 4 }
recheck = { probe = "driver", driver = "spotify_route", call = "still_playing", name = "{playlist.name}", after_s = 4 }

# No learned link: "Search in Your Library" (unverified; patterns only; the filter is cleared afterwards). Needs the
# search labels (controls library_search / library_filter) in yuki/connect/sites/spotify.toml, and they are not shipped
# (no live check has recorded them), so the route is off by data: its condition below holds for no playlist, so the
# ladder skips it ("when") and it is never tried or counted (10 Oct: every run logged "no_label" here). When a live
# check ships the labels, delete the `when` line.
[[capability."spotify.playlist".route]]
rung = "A"
variant = "search"
via = "driver"
driver = "spotify_route"
call = "play_search"
needs_focus = false
game = "states"
game_states = []
when = { slot = "playlist", in = [] }
done = { probe = "driver", driver = "spotify_route", call = "playing_here", name = "{playlist.name}", within_s = 4 }
recheck = { probe = "driver", driver = "spotify_route", call = "still_playing", name = "{playlist.name}", after_s = 4 }

# Spotify not running (or closed to the tray): started with [spotify] launch_args (never with a game in front), restored
# if it still comes up minimised, warmed, then its row.
[[capability."spotify.playlist".route]]
rung = "A"
variant = "launch"
via = "driver"
driver = "spotify_route"
call = "play_launch"
needs_focus = true
done = { probe = "driver", driver = "spotify_route", call = "playing_here", name = "{playlist.name}", within_s = 4 }
recheck = { probe = "driver", driver = "spotify_route", call = "still_playing", name = "{playlist.name}", after_s = 4 }
