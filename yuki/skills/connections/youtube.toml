# youtube.home and youtube.video: YouTube in the browser the user is already using (PLAN.md D2, D3, D16, D17, D19;
# B.2; map-skills S2.2).
#
# The browser: the one the user named; else a browser in front, or the last one in front at most 30 minutes ago; else
# their usual (the preference "youtube.home:browser"); else the browser they use most; else Windows' default handler.
# "A browser" is a measured fact, never a list: a program whose timeline rows carried a web page in the last 14 days
# (yuki/skills/web_route.py). The address is a launch argument (nothing typed). youtube.home opens the home page only:
# nothing plays until the user picks. youtube.video opens one picked video (its link from the offered options, phase T)
# and is checked playing. URL shapes come from yuki/connect/sites/youtube.toml, never copied here. Never with a game in
# front ("after the round?").
#
# Zero setup (D0): nothing to connect, no API; the browser's own window.

[connection]
app = "youtube"

[skill."youtube.home"]
end = "page"
kind = "open"
menu = "open YouTube's home page in their browser; nothing plays until they pick"
done_line = "YouTube's up."
learn_from = [["page", "*", "youtube"]]
handoff = true

[[skill."youtube.home".slot]]
name = "browser"
type = "app"
pref = "youtube.home:browser"

[[skill."youtube.home".route]]
rung = "A"
variant = "browser"
via = "driver"
driver = "web_route"
call = "youtube_home"
needs_focus = true
args = { site = "youtube", page = "home" }
done = { probe = "page_at", site = "youtube", kind = "home", within_s = 6 }
# the watcher's own read of the window in front (memory's Now board), a second source
recheck = { probe = "driver", driver = "web_route", call = "page_seen", site = "youtube", kind = "home", after_s = 3 }

[skill."youtube.video"]
end = "media_play"
kind = "change"
menu = "open one YouTube video they picked in their browser (it plays)"
done_line = "Playing it on YouTube."
learn_from = [["media_play", "*", "youtube"]]
handoff = true

# The picked video: one of the offered options (phase T gives them with their link), or the user's own words (no link:
# the thinker finds it, with this skill pinned). No taste kind on purpose: the resolver fills a slot from taste when
# the words name nothing, and a video nobody picked must never play (nothing auto-plays); phase T adds its options.
[[skill."youtube.video".slot]]
name = "video"
type = "entity"
ask = "Which video?"

# The channel the user named ("the new NDL one"), from their words only (a taste guess would reach the thinker's pin).
[[skill."youtube.video".slot]]
name = "channel"
type = "entity"

[[skill."youtube.video".slot]]
name = "browser"
type = "app"
pref = "youtube.home:browser"

[[skill."youtube.video".route]]
rung = "A"
variant = "browser"
via = "driver"
driver = "web_route"
call = "youtube_video"
needs_focus = true
when = { slot = "video", field = "ref", has = true }
args = { site = "youtube" }
done = { probe = "driver", driver = "web_route", call = "video_shown", site = "youtube", within_s = 6 }
# the browser's own media session says playing (a second source)
recheck = { probe = "driver", driver = "web_route", call = "video_playing", after_s = 4 }
