# volume: the level of one app, of the whole PC or of Yuki's own voice (phase L design §6; PLAN.md D0, D17, D19). A
# capability: what any user's PC can do. Which app and which control the user turns are learned, never written here.
#
# Zero setup: Spotify's own slider by UI Automation's RangeValue, the Windows mixer and the PC's volume by Core Audio.
# The driver is yuki/skills/spotify_route.py; Spotify's labels are data in yuki/connect/sites/spotify.toml and the
# Spotify data this file relies on (the mixer link, the request budgets) is in connections/spotify.toml.
#
# Spotify's own volume is never faked with the mixer (M6): for an in-app request the mixer is used for Spotify only
# when connections/spotify.toml records the slider and the mixer entry as one control both ways. Spotify's keys
# (Ctrl+Up / Ctrl+Down) run only with Spotify already in front and no game in front; with no game in front a minimised
# Spotify may be restored for its slider, then the previous window is put back in front.
#
# The control slot is a means: "in_app" is the target's own control (Spotify's slider; for an app without one, its own
# mixer level; the PC's own level for system), "mixer" the Windows mixer entry. It ships no default: the user's words
# or their usual for that app (preference volume:control@<app>, from their words, confirmed once) fill it; with
# neither, the ask_control rung asks the slot's question once (an app with its own control only). A learned fill
# policy doesn't reach this slot yet (it reaches driver arguments only; filling a means slot from it is lWire's scorer).
# Every route below except Spotify's own needs no window and takes no focus, so it runs with a game in front too.

[connection]
app = "audio"
state_reader = "spotify_route"

[capability.volume]
end = "volume_change"
kind = "change"
menu = "volume of an app, the PC (system) or Yuki's voice (own_voice)"
done_line = "Volume set."
offer_class = "everyday"
handoff = true
serves = [{ end = "volume_change", target = "level" }]
bind = { target = "app", level = "value", control = "means" }

# Whose volume: the app the user names (its key), else the one app playing (two playing: asked), else the whole PC.
# A call live and no app named: asked (never the call's own app by guess). The names each option goes by in the user's
# words, as an app's names are its identity (skill20, final-D P2): an option counts as their word only when their words
# hold one of its names; given otherwise, it is the caller's reading, and the one app playing (live) fills the slot.
[[capability.volume.slot]]
name = "target"
type = "app"
role = "fill"
options = ["system", "own_voice"]
live = "playing"
ask_in_call = true
default = "system"
ask = "Whose volume: an app's or the whole PC's?"

# skill22 (A17): "everything" and "speakers" name the whole PC too ("turn everything down", "louder on the speakers").
[capability.volume.slot.option_names]
system = ["system", "PC", "computer", "laptop", "master", "everything", "speakers"]
own_voice = ["own voice", "your voice", "Yuki's voice"]

[[capability.volume.slot]]
name = "change"
type = "points"
role = "fill"

[[capability.volume.slot]]
name = "level"
type = "number"
role = "fill"
min = 0
max = 100

[[capability.volume.slot]]
name = "mute"
type = "enum"
role = "fill"
options = ["on", "off"]

# The means: the target's own control or the Windows mixer. No default (design §5): with no usual and nothing
# observed, the run asks once.
[[capability.volume.slot]]
name = "control"
type = "enum"
role = "means"
options = ["in_app", "mixer"]
scope = "target"
ask = "Its own volume control, or the Windows mixer?"

# -- Spotify's own volume ---------------------------------------------------------------------------------------------
# (args.app names the app each rung acts on, so the run's ledger row names it from the start: D18.)

# Rung A, no focus, no keys, no pointer (H1): Slider "Change volume" inside the Now playing bar, by RangeValue only, read
# back. With a game in front only in the window states the live checks proved (none yet). Not while Spotify plays on
# another device.
[[capability.volume.route]]
rung = "A"
variant = "spotify_in_app"
via = "driver"
driver = "spotify_route"
args = { app = "spotify" }
call = "volume_slider"
needs_focus = false
when = [{ slot = "target", in = ["spotify"] }, { slot = "control", in = ["in_app"] }]
game = "states"
game_states = []
retry_after_acting = false
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "slider_still", target = "{target}", after_s = 5, same_source = true }

# Spotify's mixer entry as its own volume: only when connections/spotify.toml records the two as one control both ways
# (else this route says "couldn't" and nothing is set). No window: runs with a game in front.
[[capability.volume.route]]
rung = "A"
variant = "spotify_mixer"
via = "driver"
driver = "spotify_route"
args = { app = "spotify" }
call = "volume_spotify_mixer"
needs_focus = false
when = [{ slot = "target", in = ["spotify"] }, { slot = "control", in = ["in_app"] }]
game = "always"
retry_after_acting = false
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "level_still", target = "{target}", after_s = 3 }

# -- other apps, the PC, Yuki's voice -----------------------------------------------------------------------------------

# The PC's own level and Yuki's voice (Core Audio): before the mixer, so the run's row names "master" from its start.
[[capability.volume.route]]
rung = "A"
variant = "system"
via = "driver"
driver = "spotify_route"
args = { app = "master" }
call = "volume_system"
needs_focus = false
when = { slot = "target", in = ["system"] }
game = "always"
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "level_still", target = "{target}", after_s = 3 }

[[capability.volume.route]]
rung = "A"
variant = "own_voice"
via = "driver"
driver = "spotify_route"
call = "volume_own_voice"
needs_focus = false
when = { slot = "target", in = ["own_voice"] }
game = "always"
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "level_still", target = "{target}", after_s = 3 }

# The control asked once (design §5, PLAN S-1): a level or a change for an app with its own control, and nothing has
# picked the control yet (no words, no usual, nothing observed). Every rung above that acts on Spotify's own control
# needs control = "in_app", and the mixer rung below refuses Spotify without "mixer", so with no usual this asks the
# slot's question instead of handing off or guessing. The answer re-runs the request with the control, and "Keep this
# as your usual?" follows. A mute never asks (the mixer rung mutes it). Speaks only: no window, no focus, no input.
[[capability.volume.route]]
rung = "A"
variant = "ask_control"
via = "driver"
driver = "catalog"
args = { app = "spotify", slot = "control" }
call = "ask_means"
needs_focus = false
when = [{ slot = "target", in = ["spotify"] }, { slot = "control", present = false }, { slot = "mute", present = false }]
game = "always"
retry_after_acting = false
# never reached: the rung asks and acts on nothing (the loader needs a driver route's check declared; no recheck, so
# the loader lists this one rung under its warnings)
done = { probe = "read_back" }

# An app's own level in the Windows mixer. An app with its own control (own_control: driver data, true for every
# Spotify) gets the mixer only for a mute or when the user's control for it is "mixer"; never as a stand-in for its own
# control.
[[capability.volume.route]]
rung = "A"
variant = "mixer"
via = "driver"
driver = "spotify_route"
call = "volume_mixer"
needs_focus = false
game = "always"
args = { app = "{target}", own_control = ["spotify"], not_apps = ["system", "own_voice"] }
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "level_still", target = "{target}", after_s = 3 }

# -- Spotify's own volume, the rungs that take focus (never with a game in front; after every no-focus rung) -------

# Spotify's own Ctrl+Up / Ctrl+Down, only with Spotify already in front and no game in front, read back on the slider.
# (They are the app's own controls, so they are rung A variants, after the no-focus ones: rung B is the recorded click
# path, which needs a verified run before it may run.)
[[capability.volume.route]]
rung = "A"
variant = "spotify_keys"
via = "driver"
driver = "spotify_route"
args = { app = "spotify" }
call = "volume_keys"
needs_focus = true
when = [{ slot = "target", in = ["spotify"] }, { slot = "control", in = ["in_app"] }]
retry_after_acting = false
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "slider_still", target = "{target}", after_s = 5, same_source = true }

# The window-state rule, no game in front: Spotify minimised and its slider couldn't be set -> restore, set, put the
# previous window back in front.
[[capability.volume.route]]
rung = "A"
variant = "spotify_restore"
via = "driver"
driver = "spotify_route"
args = { app = "spotify" }
call = "volume_restored"
needs_focus = true
when = [{ slot = "target", in = ["spotify"] }, { slot = "control", in = ["in_app"] }]
retry_after_acting = false
done = { probe = "read_back" }
recheck = { probe = "driver", driver = "spotify_route", call = "slider_still", target = "{target}", after_s = 5, same_source = true }
