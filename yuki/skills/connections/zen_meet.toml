# meet.open: Zen comes forward on the user's Meet tab; the user clicks Join (PLAN.md D2, D3, D8, D17, D19; B.2).
#
# The Meet tab is already open in Zen (decision 9 of the chat record). It is found by identity only, never by its title:
# the RuntimeId, name digests and pinned place memory learned on every Google Meet sighting
# (nudge_state['site_tabs:Google Meet'], yuki.memory.callevidence.SiteTabs), through the tab census
# (yuki.perception.tabs). Selecting the tab is a UI Automation pattern call (no key, no pointer); bringing Zen forward
# is the guarded focus_window. If Zen's tab strip can't be read, Yuki says so and does nothing. Never with a game in
# front ("after the round?"), never handed to the thinker (it would only search), never a click on Join.
#
# Zero setup (D0): Zen's own window and tabs; no calendar, nothing to connect.

[connection]
app = "zen"

[skill."meet.open"]
end = "site_front"
kind = "open"
menu = "bring Zen forward on their Meet tab (they click Join themselves)"
done_line = "Your Meet tab is up in Zen."
# D3: what trains it and what counts as the routine happening (a glance at the Meet tab is never the meeting)
learn_from = [["site_front", "zen", "Google Meet"], ["call_join", "zen", "Google Meet"]]
routine_on = [["call_join", "zen"]]
offerable = true
handoff = false
wont = ["join"]
preview = "Open the Meet tab in Zen?"

# Which of two equal Meet tabs, counted along Zen's strip (1 = the first). Asked only when the census finds two that
# match equally (D8: two equal -> ask).
[[skill."meet.open".slot]]
name = "pick"
type = "number"
min = 1
max = 4

# A Meet link the user told Yuki once ("my standup link is ..."), kept encrypted in skills.told_ciphertext; used only
# when Zen has no Meet tab open.
[[skill."meet.open".slot]]
name = "link"
type = "text"
told = true

# Rung A: the tab census, select the tab by identity, then bring Zen forward (yuki/skills/web_route.py).
[[skill."meet.open".route]]
rung = "A"
variant = "census"
via = "driver"
driver = "web_route"
call = "meet_open"
needs_focus = true
args = { process = "zen.exe", service = "Google Meet" }
# a wrong tab or a Zen that would not come forward is never followed by opening the told link (a second Meet tab)
retry_after_acting = false
done = { probe = "driver", driver = "web_route", call = "meet_shown", process = "zen.exe", within_s = 2 }
# memory's own sighting of Google Meet in front in Zen since the run began (a site_front moment: a second source that
# tells a Meet tab from any other tab; review r1 L2)
[skill."meet.open".route.recheck]
probe = "driver"
driver = "web_route"
call = "site_front"
app = "zen"
service = "Google Meet"
after_s = 3

# Rung A, second: no Meet tab open and a told link -> open it in Zen (launch arguments, nothing typed).
[[skill."meet.open".route]]
rung = "A"
variant = "told_link"
via = "open_url"
when = { slot = "link", present = true }
args = { url = "{link}", app = "Zen" }
recheck = { probe = "foreground", process = "zen.exe", after_s = 3 }
# done only when memory saw Google Meet itself in front in Zen (review r1 L2), not just Zen in front
[skill."meet.open".route.done]
probe = "driver"
driver = "web_route"
call = "site_front"
app = "zen"
service = "Google Meet"
within_s = 6
