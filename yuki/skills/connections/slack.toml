# Slack: its own data for the `message` capability (message.toml) (phase L design §6; PLAN.md D0, D17, D19, Q3/rule 8).
# Driver data only: true for anyone's Slack; whom the user messages there is learned, never written here.
#
# A chat whose address memory captured (app.slack.com/client/{team}/{channel}) opens by Slack's own link
# (slack://channel?team=...&id=..., which opens DMs too); any other chat through Slack's own quick switcher (Ctrl+K,
# the chat's name, Enter). No Slack API and no app install: Slack's desktop window and its documented
# deep links only. The chat is checked open by memory's encrypted thread ids before anything is typed. Never with a game
# in front.
#
# Zero setup (D0): nothing to connect.

[connection]
app = "slack"

[chat]
title = "Slack"
images = ["slack.exe"]
processes = ["slack"]
services = ["app.slack.com", "slack"]
switcher = ["ctrl", "k"]
open = ["enter"]
send = ["enter"]
# closes the quick switcher (chat19): sent only for a switcher Yuki's own run opened and didn't finish. No composer
# label here (not read live yet): the message box is the field Slack itself gives the keyboard as the chat opens
close = ["escape"]
# select everything in the message box (a draft Yuki typed there itself is typed over, never the user's:
# yuki/skills/chat.py typed_by_yuki)
select_all = ["ctrl", "a"]

# A chat's own address -> its deep link (Slack's documented URL and URI shapes; fixed machine formats).
[[chat.links]]
url = "https://app.slack.com/client/{team}/{channel}"
uri = "slack://channel?team={team}&id={channel}"
