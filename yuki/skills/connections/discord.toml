# Discord: discord.voice, and Discord's own data for the `message` skill (message.toml) (PLAN.md D0, D2, D17, D19,
# Q3/rule 8; B.2; map-skills S2.5).
#
# discord.voice joins a voice channel through Discord's own quick switcher (Ctrl+K, then "!" and the channel's name:
# Discord's documented voice-channel filter), asks first when the user is already in a call, and presses Discord's
# "Join Voice" button only if the switcher only opened the channel (unverified until the first live run). Checked by
# Discord taking the microphone within 5 s (an onset: a microphone it already held proves nothing). Joining is judged
# like a send (rule 8): only on the user's plain words, through Yuki's own check. Never with a game in front.
#
# Zero setup (D0): Discord's own window, shortcuts and discord:// links; never Discord's private user APIs.

[connection]
app = "discord"

# Discord's own facts, read by yuki/skills/chat.py (data, never a guess: identities, documented shapes, labels).
[chat]
title = "Discord"
# its desktop app's program (window lookups, done-checks) and the app keys memory stores it under (threads.process)
images = ["Discord.exe"]
processes = ["discord"]
# the services memory's people index stores Discord routes under (a URL host, or the process key)
services = ["discord.com", "discord"]
# its documented shortcuts (only ever sent into Discord's own window, with no game in front)
switcher = ["ctrl", "k"]
open = ["enter"]
send = ["enter"]

# The quick switcher's filters: "@" a person, "#" a text channel, "!" a voice channel. A group DM goes by its name.
[chat.prefix]
dm = "@"
channel = "#"
voice = "!"

# A chat's own address (from memory's capture threads) -> its deep link. Discord's URL and URI shapes, fixed machine
# formats; the first that matches wins (a DM's "@me" before a server's id).
[[chat.links]]
url = "https://discord.com/channels/@me/{channel}"
uri = "discord://-/channels/@me/{channel}"

[[chat.links]]
url = "https://discord.com/channels/{guild}/{channel}"
uri = "discord://-/channels/{guild}/{channel}"

# Discord's UI labels per display language (the button shown in an opened voice channel before joining).
[chat.labels.en]
join_voice = ["Button", "Join Voice"]

[skill."discord.voice"]
end = "call_join"
kind = "change"
menu = "join one of their Discord voice channels (asks first if they are already in a call)"
done_line = "Joined {channel} on Discord."
learn_from = [["call_join", "discord"]]
routine_on = [["call_join", "discord"]]
handoff = true

# The channel, from the user's words only (redteam D10: a channel nobody named is never joined, so no taste fill; a
# join that took is noted in tastes as kind discord_voice for phase T).
[[skill."discord.voice".slot]]
name = "channel"
type = "entity"
required = true
ask = "Which voice channel?"

# Asked (never guessed) when a call is live and the user's words didn't already say to leave it.
[[skill."discord.voice".slot]]
name = "leave_call"
type = "bool"
ask_in_call = true
ask = "You're already in a call. Leave it and join?"

[[skill."discord.voice".route]]
rung = "A"
variant = "switcher"
via = "driver"
driver = "chat"
call = "voice_join"
needs_focus = true
args = { app = "discord" }
# a join that didn't take is not followed by the thinker clicking around in Discord
retry_after_acting = false
done = { probe = "mic_held", process = "Discord.exe", within_s = 5 }
recheck = { probe = "mic_held", process = "Discord.exe", after_s = 3, same_source = true }
