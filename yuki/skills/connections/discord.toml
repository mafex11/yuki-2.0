# Discord: its own data for the chat capabilities (message.toml's `message`, and `discord.voice` below) (phase L design
# §6; PLAN.md D0, D17, D19, Q3/rule 8). Driver data: true for anyone's Discord. Which channels and people the user
# joins and messages, and when, are learned, never written here.
#
# discord.voice joins a voice channel by its server and/or its name (kHands): first by the channel's own deep link, for a
# voice channel memory saw in Discord (its capture threads keep the channel's address and, in the window title, the
# server it sits in: "<channel> | <server>"; yuki/skills/discord_route.py); else through Discord's own quick switcher
# (Ctrl+K, then "!" and the channel's name: Discord's documented voice-channel filter). Either way it asks first when
# the user is already in a call (saying what will happen:
# Discord switches its own channel; another app's call is never left, so none is promised), and presses Discord's
# "Join Voice" button only if the switcher only opened the channel (unverified until the first live run). Checked by
# Discord taking the microphone within 5 s (an onset: a microphone it already held proves nothing). Joining is judged
# like a send (rule 8): only on the user's plain words, through Yuki's own check (commit = "words"); never offered.
# Never with a game in front.
#
# Zero setup (D0): Discord's own window, shortcuts and discord:// links; never Discord's private user APIs.

[connection]
app = "discord"

# Discord's own facts, read by yuki/skills/chat.py (data, never a guess: identities, documented shapes, labels).
[chat]
title = "Discord"
# its desktop app's program (window lookups, done-checks) and the app keys memory stores it under (threads.process)
images = ["Discord.exe"]
processes = ["discord"]
# the services memory's people index stores Discord routes under (a URL host, or the process key)
services = ["discord.com", "discord"]
# its documented shortcuts (only ever sent into Discord's own window, with no game in front)
switcher = ["ctrl", "k"]
open = ["enter"]
send = ["enter"]
# select everything in the message box (a draft Yuki typed there itself is typed over, never the user's:
# yuki/skills/chat.py typed_by_yuki)
select_all = ["ctrl", "a"]
# a chat's window title is "<chat><place_sep><place>" ("#general | Friends"): the server a channel sits in, as memory's
# capture keeps the title (yuki/skills/discord_route.py)
place_sep = " | "

# The quick switcher's filters: "@" a person, "#" a text channel, "!" a voice channel. A group DM goes by its name.
[chat.prefix]
dm = "@"
channel = "#"
voice = "!"

# A chat's own address (from memory's capture threads) -> its deep link. Discord's URL and URI shapes, fixed machine
# formats; the first that matches wins (a DM's "@me" before a server's id).
[[chat.links]]
url = "https://discord.com/channels/@me/{channel}"
uri = "discord://-/channels/@me/{channel}"

[[chat.links]]
url = "https://discord.com/channels/{guild}/{channel}"
uri = "discord://-/channels/{guild}/{channel}"

# Discord's UI labels per display language (the button shown in an opened voice channel before joining).
[chat.labels.en]
join_voice = ["Button", "Join Voice"]
# the header Discord shows on a voice channel; memory's capture keeps it before the channel's name in the scope
voice_channel = ["Voice Channel"]

# What is asked before a join while a call is live (review r2 M2): Discord's own call -> it switches channel by itself;
# any other call (Meet, a WhatsApp call, a Slack huddle, or one memory can't name) stays live, so the join is "as well".
[chat.asks]
switch = "Switch to {channel}?"
in_call = "You're already in a call. Join {channel} on Discord as well?"

[capability."discord.voice"]
end = "call_join"
kind = "change"
menu = "join a Discord voice channel by its name and/or its server (asks first during a call)"
done_line = "Joined {channel}."
commit = "words"
offer_class = "never"
handoff = true
serves = [{ end = "call_join", target = "call", needs = "chat_voice" }]

# The channel, from the user's words only (redteam D10: never filled by taste; a join that took is noted in tastes as
# kind discord_voice). Not required (kHands): with a server named and no channel, the link rung joins the one voice
# channel memory saw there, or the one of them the user joined most (picked tastes only, never a name only seen);
# else it asks which. Words that name only part of a channel's name join it only when it is the only one there or the
# one they join most (yuki/skills/discord_route.py pick_voice_channel).
[[capability."discord.voice".slot]]
name = "channel"
type = "entity"
role = "fill"
ask = "Which voice channel?"

# The server, in the user's own words: matched to a server memory saw a voice channel in (its words held, by sound, or
# said as its letters; a server matched only by its letters never settles a join by itself: the channel is asked by
# name). Never filled by taste.
[[capability."discord.voice".slot]]
name = "server"
type = "entity"
role = "fill"

# The user's answer to the in-call question ([chat.asks]): true joins anyway, false leaves their call as it is. The
# question is asked in the rung (yuki/skills/chat.py route_voice_join), after the engine's game check, so a game in
# front is "after the round?" and never this question (review r2 L1); never guessed.
[[capability."discord.voice".slot]]
name = "join_in_call"
type = "bool"
role = "fill"

# Rung A first (kHands): a voice channel memory saw, by its server and/or name, opened by its own deep link
# (discord://-/channels/<server>/<channel>), then joined as after the switcher.
[[capability."discord.voice".route]]
rung = "A"
variant = "link"
via = "driver"
driver = "discord_route"
call = "voice_link"
needs_focus = true
means = "app"
args = { app = "discord" }
say = "Joined {channel} on Discord."
retry_after_acting = false
done = { probe = "mic_held", process = "Discord.exe", within_s = 5 }
recheck = { probe = "mic_held", process = "Discord.exe", after_s = 3, same_source = true }

[[capability."discord.voice".route]]
rung = "A"
variant = "switcher"
via = "driver"
driver = "chat"
call = "voice_join"
needs_focus = true
means = "app"
args = { app = "discord" }
say = "Joined {channel} on Discord."
# a join that didn't take is not followed by the thinker clicking around in Discord
retry_after_acting = false
done = { probe = "mic_held", process = "Discord.exe", within_s = 5 }
recheck = { probe = "mic_held", process = "Discord.exe", after_s = 3, same_source = true }
