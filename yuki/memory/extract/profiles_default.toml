[[profile]]
name = "gmail"                       # MaxMi (Gmail DOM classes adn/gD/g3/a3s/zA/hP)
kind = "email"
hosts = ["mail.google.com"]
header = ['//*[class~="hP"]']
# An open thread: one container per expanded message.
list = ['//*[aria="main"]', '//*[landmark="main"]']
row = ['//*[class~="adn"]']
sender = ['//*[class~="gD"]', '//*[class~="go"]']
time = ['//*[class~="g3"]']
body = ['//*[class~="a3s"]']
composer = ['//*[name="Message Body"]']
# The inbox/list view: rows become the body of a "list" extraction.
list_rows = ['//*[class~="zA"]']

