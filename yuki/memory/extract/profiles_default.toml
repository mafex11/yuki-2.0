# ---------------------------------------------------------------------------
[[profile]]
name = "messenger"                   # messenger.com / facebook.com/messages (atomic CSS: ARIA names only)
kind = "conversation"
hosts = ["www.messenger.com", "messenger.com", "www.facebook.com", "facebook.com"]
paths = ["/messages", "/t/", "/e2ee/"]
header = ['//*[aria="main"]//*[aria="heading"]']
list = ['//*[name^="Messages in conversation"]', '//*[aria="grid"][name*="onversation"]']
row = ['/*[aria="row"]', '//*[aria="row"]']

[[profile]]
name = "instagram_reels"             # verified 2026-09-24 night (Chrome, instagram.com/reels feed)
kind = "video"
hosts = ["www.instagram.com", "instagram.com"]
paths = ["/reels/", "/reel/"]
# Atomic CSS, so ARIA facts only. The account is the link to its reels ("<name> reels",
# its Text child is the bare name); the caption is a Button (Instagram expands it on
# click), which generic text drops like every action control, so it is the title here:
# the caption Button's Group holds the text and the hashtag links. The <video> is a plain
# group, so a reel whose anchors do not match falls back to the generic page.
title = ['//*[landmark="main"]//Button/Group']
author = ['//*[landmark="main"]//Hyperlink[value$="/reels/"]/Text']
description_lines = 2

[[profile]]
name = "instagram_direct"            # instagram.com/direct (atomic CSS: ARIA names only)
kind = "conversation"
hosts = ["www.instagram.com", "instagram.com"]
paths = ["/direct"]
header = ['//*[aria="main"]//*[aria="heading"]']
list = ['//*[name^="Messages in conversation"]', '//*[aria="grid"]']
row = ['/*[aria="row"]', '//*[aria="row"]']

# ---------------------------------------------------------------------------
[[profile]]
name = "claude_chat"                 # verified 2026-09-24 night (Claude desktop = claude.ai, a Cowork task)
kind = "conversation"
hosts = ["claude.ai"]
paths = ["/chat/", "/cowork/", "/project/"]
# The feed "Chat messages" holds one article per message ("Message 1 of 2"); each starts
# with a screen-reader-only heading "You said: ..." / "Claude responded: ...", which
# repeats the text and is not content. There is no visible sender name, so the user's
# own messages are told by that heading and the rest have no sender.
header = ['//*[id="cowork-title-slot"]/Button', '//*[aria="main"]//*[aria="heading"][class~="truncate"]']
scope_strip = [", rename session"]
list = ['//*[name="Chat messages"]', '//*[aria="feed"]']
row = ['/*[aria="article"]']
time = ['//*[aria="time"]']
me_row = ['//Text[class~="sr-only"][aria="heading"][name^="You said:"]']
exclude = ['//Text[class~="sr-only"]', '//*[class~="sr-only"]']
composer = ['//*[class~="ProseMirror"]', '//Edit[name^="Write your prompt"]']
generic_sender = false

# ---------------------------------------------------------------------------
# Video pages (kind "video"): the body is the video's title, its channel and the
# first lines of its description - recommendations, comments, live chat and the
# player's controls are never read.  Anchors not found fall back to structure
# (see extract/page.py extract_video); nothing found at all -> generic page with
# `main`/`chrome` below.
[[profile]]
name = "youtube"                     # verified 2026-09-24 night (Chrome watch page, read live)
kind = "video"
hosts = ["youtube.com"]
paths = ["/watch"]
# Seen live 2026-09-24: Chromium's UIA tree flattens the wrappers (no #above-the-fold,
# no #channel-name) and reports the <video> as a plain group, so the anchors are the
# ytd-watch-metadata groups: Group id=title > heading h1, Group id=owner > ... Group
# class ytd-channel-name > Hyperlink, Group id=description. The older DOM-id paths stay
# as later tiers.
title = [
  '//*[id="title"][class~="ytd-watch-metadata"]//*[aria="heading"]',
  '//*[id="above-the-fold"]//*[id="title"]//*[aria="heading"]',
  '//*[id="above-the-fold"]//*[aria="heading"]',
]
author = [
  '//*[id="owner"][class~="ytd-watch-metadata"]//*[class~="ytd-channel-name"]//Hyperlink',
  '//*[id="owner"]//*[id="channel-name"]//Hyperlink',
  '//*[id="owner"]//*[id="channel-name"]//*[id="text"]',
]
# The collapsed description box: views and date, then its first lines ("...more" is a button, never text).
# Below the fold on a 1440-px screen, so often empty (visible-only read).
description = [
  '//*[id="description"][class~="ytd-watch-metadata"]',
  '//*[id="above-the-fold"]//*[id="description-inner"]',
  '//*[id="above-the-fold"]//*[id="description"]',
]
description_lines = 4
# Window/page title "(3) <video title> - YouTube" (the counter is cut generically).
title_strip = [" - YouTube"]
# Generic page fallback: the primary column only (so no recommendations), comments
# out (`chrome` is tiered like every anchor list: the first path that matches is used).
main = ['//*[id="primary-inner"]', '//*[id="primary"]']
chrome = ['//*[id="comments"]', '//*[id="secondary"]']

# ---------------------------------------------------------------------------
# Spotify desktop (CEF; always the same URL, xpui.app.spotify.com/index.html). Seen live
# 2026-09-24 night: without a profile a playlist's track grid - rows with a "date added"
# label - was read by the generic chat detector as a conversation ("Play prozac by
# brakence" as a sender). A page: the main landmark, one thread per view (the page title,
# "touch grass - playlist by Mafex | Spotify").
[[profile]]
name = "spotify"
kind = "page"
processes = ["spotify.exe"]
hosts = ["open.spotify.com"]
# While music plays the page title is the track ("IVY • Elroy"); the main landmark's Name
# stays the view's title, so it is the header.
header = ['//*[aria="main"][landmark="main"]', '//*[landmark="main"]']
scope_strip = [" | Spotify"]
title_split = " | "
title_part = 0
main = ['//*[aria="main"]', '//*[landmark="main"]']

# ---------------------------------------------------------------------------
# Windows Settings (SystemSettings.exe inside the ApplicationFrameHost frame).
# The breadcrumb names the page ("Personalization Background"): one thread per
# Settings page.  The navigation pane (account name and e-mail) is not main.
# Password fields (Wi-Fi keys, PINs) are never read (extract/uia.py).
[[profile]]
name = "windows_settings"            # verified 2026-09-24 (Settings > Personalization > Background)
kind = "page"
processes = ["systemsettings.exe"]
header = ['//*[id^="PermanentNavigationViewBreadcr"]', '//Group[class="LandmarkTarget"][landmark="navigation"]']
main = ['//Group[class="LandmarkTarget"][landmark="main"]']
# Pages without a main landmark (System, Personalization) are read whole: the search box is not content.
chrome = ['//Edit[id="CommandSearchTextBox"]']

# ---------------------------------------------------------------------------
# Terminals: the text is the terminal control's Text pattern (Windows Terminal,
# conhost).  Warp draws with the GPU and exposes only its title (see notes).
[[profile]]
name = "terminal"
kind = "terminal"
processes = ["windowsterminal.exe", "openconsole.exe", "conhost.exe", "cmd.exe", "powershell.exe", "pwsh.exe", "warp.exe", "wezterm-gui.exe", "alacritty.exe"]
main = ['//*[class~="TermControl"]', '//Document', '//Edit']

# Editors whose buffer is a Document/Edit value.
[[profile]]
name = "editor"
kind = "document"
processes = ["notepad.exe", "notepad++.exe", "code.exe", "cursor.exe", "winword.exe", "sublime_text.exe", "obsidian.exe"]
# The document is the thread: window title "<file> - Notepad" / "<file> - <folder> - Visual Studio
# Code" ("*" marks unsaved). Without this every Notepad document was one thread named after its
# edit control, "Text editor" (seen live 2026-09-24 night).
title_split = " - "
title_part = 0
scope_strip = ["*", "● "]
main = ['//*[class^="monaco-editor"]//Edit', '//Document[class*="RichEdit"]', '//Document', '//Edit']

# File Explorer: the items view is the content; the navigation tree is chrome.
[[profile]]
name = "file_explorer"
kind = "list"
processes = ["explorer.exe"]
# Window title "<folder> - File Explorer": the folder is the thread.
title_split = " - "
title_part = 0
main =['//List[id="ItemsView"]', '//*[class~="UIItemsView"]', '//DataGrid', '//List']
