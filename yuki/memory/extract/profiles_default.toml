[[profile]]
name = "outlook_web"                 # ARIA names of Outlook on the web (not yet seen live here)
kind = "email"
hosts = ["outlook.office.com", "outlook.live.com", "outlook.office365.com", "outlook.cloud.microsoft"]
header = ['//*[name="Reading Pane"]//*[aria="heading"]', '//*[class~="outlook-subject"]']
list = ['//*[name="Reading Pane"]']
