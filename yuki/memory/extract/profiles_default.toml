sender = ['//*[class~="outlook-message-header"]//Button', '//*[name^="From: "]']
body = ['//*[name="Message body"]', '//*[class~="outlook-message-body"]']
composer = ['//*[name="Message body, press Alt+F10 to exit"]', '//*[id="outlook-compose-body"]']
list_rows = ['//*[name="Message list"]//*[aria="option"]', '//*[class~="outlook-message-row"]']

# ---------------------------------------------------------------------------
[[profile]]
name = "linkedin_messaging"          # MaxMi (LinkedIn msg-* classes)
kind = "conversation"
hosts = ["www.linkedin.com", "linkedin.com"]
paths = ["/messaging"]
header = ['//*[class~="msg-entity-lockup__entity-title"]', '//*[class^="msg-title-bar"]//*[aria="heading"]']
list = ['//*[class~="msg-s-message-list"]', '//*[class^="msg-s-message-list-content"]']
row = ['//*[class~="msg-s-message-list__event"]']
# Seen live 2026-09-24 night: in the open thread the group name is not a visible element;
# the sender is the row's profile picture (Image named after them).
sender = ['//*[class~="msg-s-message-group__name"]', '//Image[class~="msg-s-event-listitem__profile-picture"]']
time = ['//*[class~="msg-s-message-group__timestamp"]']
body = ['//*[class~="msg-s-event-listitem__body"]']
day_separator = ['/*[class~="msg-s-message-list__time-heading"]', '//*[class~="msg-s-message-list__time-heading"]']
composer = ['//*[class~="msg-form__contenteditable"]']
self_name = ['//*[class~="global-nav__me-photo"]']
self_name_strip = ["Photo of "]
# A sender group continues until the next named group (LinkedIn shows the name once).
sender_carries = true

