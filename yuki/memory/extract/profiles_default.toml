# Yuki capture extraction profiles (data, not code).
#
# Each [[profile]] tells the generic extractors where an app keeps its
# content, as paths over UI Automation facts (see yuki/memory/extract/query.py):
#   //*[class~="c-message_list"]      Chromium/Gecko expose the HTML class attribute as UIA ClassName
#   //ListItem[id^="chat-messages-"]  ...and the HTML id as AutomationId
#   //List[name^="Messages in"]       aria-label becomes the UIA Name
# Operators: = exact, ^= prefix, $= suffix, *= contains, ~= class/word token; [!...] negates.
# `class` compares per token for = ^= $= ~= and case-insensitively.
#
# A profile applies when the page URL's host matches `hosts` (optionally
# narrowed by `paths`), or the window's process matches `processes`.  The
# first match wins; profiles in the user's override file
# (%LOCALAPPDATA%\Yuki\memory\extract_profiles.toml, same shape) come first and
# replace a default profile of the same name.  Every anchor list is tiered:
# the first path that selects anything is used.  Anything a profile does not
# say (or that does not match any more after an app update) falls back to the
# generic structural extractors, so a stale anchor degrades, it does not break.
#
# Status of each anchor set:
#   verified 2026-09-24 = read live (read-only) from the app on this PC
#   MaxMi              = ported from MaxMi's fixture-verified anchors, not yet seen live here

[defaults]
# Marks an app puts inside or next to a message that are not the message.
text_noise = ["(edited)", "(bearbeitet)", "(modifié)", "(editado)"]
# A sender shown with one of these names is the user.
me_senders = ["You", "you", "Me"]
# "Sudhanshu (you)" - the name before the suffix is the user's.
me_suffixes = ["(you)", "(You)"]
# Sidebar previews "You: ok" (only used to learn nothing about senders: previews are chrome).
me_prefixes = ["You:"]

# ---------------------------------------------------------------------------
[[profile]]
name = "slack"                       # verified 2026-09-24 (Slack desktop, Threads view)
kind = "conversation"
hosts = ["app.slack.com"]
processes = ["slack.exe"]
# Window title "<view> - <workspace> - Slack"
title_split = " - "
title_part = 0
scope_strip = ["#"]
header = [
  '//*[class^="p-view_header__channel_title"]',
  '//*[class~="p-view_contents--primary"]/ToolBar[class^="p-view_header"]//Text',
]
list = [
  '//*[class~="c-message_list"]',
  '//*[class~="p-view_contents--primary"]//List[class~="c-virtual_list__scroll_container"]',
  # A thread open in the side pane (seen live 2026-09-24 night: the channel's own
  # list was not in the tree, the thread's replies were).
  '//*[class~="p-view_contents--secondary"]//List[class~="c-virtual_list__scroll_container"]',
  # A DM or channel: the message pane's list is a screen-reader-only List (class sr-only,
  # 2x1 px, off-screen) whose rows are on screen (seen live 2026-09-24 night).
  '//*[class~="p-message_pane"]//List',
]
# A thread's "12 replies" divider is a list item too, id'd "...-thread-list-Thread_separator".
row = ['/*[class~="c-virtual_list__item"][!id$="_separator"]', '//*[class^="c-message_kit__background"]']
sender = ['//*[class^="c-message__sender"]']
time = ['//*[class~="c-timestamp"]']
day_separator = ['//*[class^="c-message_list__day_divider"]', '//*[class^="p-message_pane__day_divider"]']
exclude = [
  '//*[class^="c-reaction_bar"]',
  '//*[class^="c-message_actions"]',
  '//*[class^="c-file__actions"]',
  '//*[class^="c-message__reply_bar"]',
  '//*[class^="c-message_kit__thread_replies"]',
  '//*[class^="p-threads_view_header__permalink"]',
]
composer = ['//*[class~="ql-editor"]', '//*[class^="p-message_input"]']
# Rows are id'd "...-<channel>-<ts>": the message's own id, and ts is epoch seconds.
id_source = "automation_id"
id_time = "epoch_seconds"
self_name = ['//*[class^="p-ia__nav__user__button"]']
self_name_strip = ["User: "]

# ---------------------------------------------------------------------------
[[profile]]
name = "discord"                     # verified 2026-09-24 (Discord desktop, DM view); hashed class suffixes -> ^= anchors
kind = "conversation"
hosts = ["discord.com", "ptb.discord.com", "canary.discord.com"]
processes = ["discord.exe", "discordptb.exe", "discordcanary.exe"]
# Window title "#channel | Server - Discord" or "@friend - Discord"
title_split = " | "
title_part = 0
scope_strip = ["#", "@", " - Discord"]
header = ['//*[class^="title_"]//*[aria="heading"]', '//*[aria="heading"][class^="title_"]']
list = ['//List[name^="Messages in"]', '//*[id="messages"]', '//*[class^="messagesWrapper_"]//List']
row = ['/ListItem[id^="chat-messages-"]', '/*[class^="messageListItem_"]']
# The day divider is a Thumb/separator child of the list ("September 24, 2026").
sender = ['//*[class^="username_"]', '//*[id^="message-username-"]']
time = ['//*[aria="time"]', '//*[id^="message-timestamp-"]', '//*[class^="timestamp_"]']
body = ['//*[id^="message-content-"]', '//*[class^="messageContent_"]']
day_separator = ['/*[class^="divider_"][aria="separator"]', '/*[aria="separator"]']
exclude = [
  '//*[class^="reactions_"]',
  '//*[class^="buttonContainer_"]',
  '//*[class^="repliedMessage_"]',
  '//*[class^="hoverButton_"]',
  '//*[class^="header_"][aria="heading"]',
  # The hover bar over the message under the mouse (quick reactions, Edit, Forward, More):
  # seen live 2026-09-24 night as Group 'Message Actions' class "buttons__5126c container__040f0",
  # its tooltips (":thumbsup:", "Add Reaction") as Text siblings of the buttons.
  '//Group[name="Message Actions"]',
  '//*[class^="buttons__"][class^="container__"]',
]
composer = ['//*[class^="slateTextArea_"]', '//*[aria="textbox"][class^="markup_"]']
# Rows are id'd "chat-messages-<channel>-<message snowflake>".
id_source = "automation_id"
id_time = "snowflake"
id_epoch_ms = 1420070400000
# The account panel at the bottom left: its first text is the user's display name.
self_name = ['//*[class^="accountPopoutButtonWrapper_"]//Text', '//*[class^="panelTitleContainer_"]']

# ---------------------------------------------------------------------------
[[profile]]
name = "whatsapp"                    # verified 2026-09-24 (WhatsApp for Windows = WebView2 of web.whatsapp.com, 1:1 chat)
kind = "conversation"
hosts = ["web.whatsapp.com"]
processes = ["whatsapp.exe", "whatsapp.root.exe"]
# Classes are atomic CSS ("x1n2onr6"), so the anchors are ids, ARIA roles and
# icon names.  The open chat is id="main" (the chat list is id="pane-side"):
# banner (avatar button with a description, then the chat-name button), the
# message scroller, and the composer footer.
# The chat-name button's first Text is the name; the button's own Name adds the group's
# member list ("RES Eesha, rishabh, You", seen live 2026-09-24 night).
header = ['//*[id="main"]/*[aria="banner"]/Button[!desc*=""]/Text', '//*[id="main"]/*[aria="banner"]/Button[!desc*=""]']
list = ['//*[id="main"]']
# One role="row" per message; each run of one sender's messages shares a parent.
row = ['//*[aria="row"]']
# Bubbles carry a screen-reader label "You:" / "<name>:"; Chromium reports
# most of them IsOffscreen, so hidden_labels keeps them for this anchor.
hidden_labels = true
sender = ['//Group[name$=":"]']
sender_strip = [":", "Open chat details for "]
sender_group = "parent"
# Group chats (seen live 2026-09-24 night): the bubbles carry no "<name>:" label; the
# run's container holds the sender's avatar button "Open chat details for <name>".
sender_parent = ['/Group/Button[name^="Open chat details for "]']
generic_sender = false
# Own bubbles: the time sits in a button with the delivery tick ("11:05 Read");
# incoming bubbles show a bare time text (found structurally).
time = ['//Button[name*=":"]/Text']
me_row = ['//Button[name*=":"]//Image[help^="wds-ic-"]']
exclude = ['//*[aria="button"][name^="React"]']
composer = ['//*[id="main"]//*[aria="textbox"]', '//*[id="main"]//Edit']
date_order = "dmy"

