# Yuki memory - privacy rules (defaults).
#
# On first run this file is copied to %LOCALAPPDATA%\Yuki\memory\privacy.toml.
# Edit THAT copy; the watcher re-reads it whenever it changes (no restart).
# Every rule here is data about what must never be recorded.  Nothing in this
# file tells Yuki how to behave; it only says what the watcher may not read.
#
# Matching:
#   * process names are Windows image names ("chrome.exe"), case-insensitive;
#   * hosts match exactly or as a parent domain ("chase.com" also blocks
#     "secure.chase.com"), case-insensitive;
#   * per-site path fragments are case-insensitive substrings.
# Keys older copies of this file had and that are no longer read (they were
# word lists guessing what a page or app is): blocked_process_substrings,
# blocked_path_fragments, [adult] host_substrings / query_terms / query_params,
# [terminal] secret_patterns, [meetings] processes / host_suffixes /
# host_paths, and the [calls] app list's old meaning (see those tables).
# Seeded from MaxMi's Denylist.swift, mapped to Windows.

version = 1

[pause]
# Stop capturing entirely while the session is locked.
when_locked = true
# Stop capturing content while a full-screen window is in front (a game,
# a full-screen video, a presentation).  The timeline still counts the time:
# the app's name, start/end, active or away and whether media played - never
# the window's title or page.
when_fullscreen = true

[fields]
# Never read the value of a UIA element whose IsPassword is true.
drop_password_values = true
# Skip the whole capture while the focused control is a password field.
skip_when_password_focused = true
# Skip the whole capture while any password field is on screen (a sign-in
# page, a credentials dialog, a Wi-Fi key field in Settings) - read from the
# window itself (UIA IsPassword), whatever its address says.
skip_when_password_present = true
# A value or line made only of these characters is a masked secret: dropped.
mask_characters = "•●∙·*◦⦁⚫"

[own]
# Never read Yuki's own windows (the tray app, its overlay, its dialogs).
skip_own_windows = true

[apps]
# Never read windows of these processes.
blocked_processes = [
    # password managers and authenticators
    "1Password.exe",
    "Bitwarden.exe",
    "KeePass.exe",
    "KeePassXC.exe",
    "LastPass.exe",
    "Dashlane.exe",
    "Enpass.exe",
    "RoboForm.exe",
    "NordPass.exe",
    "ProtonPass.exe",
    "Proton Pass.exe",
    "Keeper Password Manager.exe",
    "KeeperPasswordManager.exe",
    "Authy Desktop.exe",
    "WinAuth.exe",
    # Windows credential and sign-in surfaces
    "CredentialUIBroker.exe",
    "LogonUI.exe",
    "LockApp.exe",
    "consent.exe",
    # meeting apps: never read (the timeline still counts meeting hours, see [meetings])
    "Zoom.exe",
    # Windows Settings (SystemSettings.exe) is read on purpose (user's choice,
    # 2026-09-24).  Its Wi-Fi key and PIN fields are password fields: their
    # values are never read, and a page showing one is skipped (see [fields]).
]
# Window titles (exact, case-insensitive) never read, whatever the process:
# Control Panel applets that live inside explorer.exe.
blocked_window_titles = ["Credential Manager"]

# Private / incognito browser windows.  Browsers mark these in the window title;
# each rule is one browser's mark.  process = "*" means any process.
[[private_windows]]
process = "msedge.exe"
title_contains = "InPrivate"

[[private_windows]]
process = "*"
title_endswith = "(Incognito)"

[[private_windows]]
process = "*"
title_endswith = "(Private)"

[[private_windows]]
process = "*"
title_endswith = "(Private with Tor)"

[[private_windows]]
process = "*"
title_endswith = "Private Browsing"

[web]
# Pages with these URL schemes are never read (browser settings / password /
# wallet pages, extension pages, raw data).  "file" is not listed: many desktop
# apps draw their own UI from file:// pages.  Add it to block local files
# opened in a browser.
blocked_schemes = [
    "chrome", "edge", "about", "arc", "brave", "vivaldi", "opera",
    "view-source", "devtools", "chrome-extension", "moz-extension",
    "extension", "chrome-untrusted", "chrome-search", "edge-extension",
    "data", "blob", "javascript",
]
# http(s) pages without a host are not read (fail closed).
block_hostless_web = true
# A URL carrying a user name or password is not read.
block_credentials_in_url = true

# Sign-in, password-manager, banking, payment and meeting sites.
blocked_host_suffixes = [
    "accounts.google.com", "passwords.google.com",
    "login.microsoftonline.com", "login.live.com", "account.live.com",
    "account.microsoft.com", "appleid.apple.com", "idmsa.apple.com",
    "bitwarden.com", "1password.com", "okta.com", "lastpass.com",
    "dashlane.com", "authy.com", "auth0.com",
    "netbanking.hdfcbank.com", "onlinesbi.sbi", "icicibank.com", "axisbank.com",
    "chase.com", "bankofamerica.com", "wellsfargo.com",
    "paypal.com",
    "meet.google.com", "zoom.us",
]
# Sign-in pages anywhere are skipped by the password field they show (see
# [fields] skip_when_password_present), not by words in their address.

# Per-site path rules: host (and its subdomains) -> path fragments.
[web.blocked_host_paths]
"teams.microsoft.com" = ["/l/meetup-join", "/meetup-join/", "/meeting/"]
"teams.live.com" = ["/l/meetup-join", "/meetup-join/", "/meeting/"]

[adult]
# Named sites never read (hosts and their subdomains).  Add your own here or
# to [user] blocked_domains.
host_suffixes = [
    "pornhub.com", "pornhub.org", "xvideos.com", "xnxx.com", "redtube.com",
    "youporn.com", "xhamster.com", "spankbang.com", "jav.guru", "hanime.tv",
    "onlyfans.com", "chaturbate.com", "stripchat.com",
]

[user]
# Your own blocklist.  Apps: process name ("discord.exe") or app name
# ("Discord").  Domains: "example.com" also blocks its subdomains.
blocked_apps = []
blocked_domains = []

[trace]
# Recording how you work (docs/research/revamp-2026-10-02/78-capture-and-learning.md): which button
# or field you use, what kind of action and what changed - never the letters you type, never what
# you copy, never pixels.  OFF until you turn on Settings -> Privacy and pause -> Record how I work.
# The tray's pause pauses it; the raw list is kept 30 days.
record_actions = false
# Apps left out of it, by the app's name ("FL Studio") or process name ("discord.exe"), set from
# Settings -> Privacy and pause -> Record how I work.
leave_out = []
# Files in these folders are never noted when you open or save them (password-manager vaults, temp).
blocked_folders = ["%TEMP%", "%APPDATA%\\Bitwarden", "%LOCALAPPDATA%\\1Password", "%APPDATA%\\KeePass",
                   "%APPDATA%\\KeePassXC", "%LOCALAPPDATA%\\Dashlane"]
# Measuring what recording costs (report 96): when true, recording is on in even hours and off in odd
# ones, and the CPU of the app in front and of the memory service is sampled every 10 seconds.
ab_hours = false
# How soon Yuki may use what it learns from how you work (your decision of 7 Oct 2026, D3; nothing
# uses these before phase C4): your fix after Yuki failed is used at once; something you showed once
# is a hint at once, and Yuki may do it alone after you did it this many times, or after this many
# of its own runs that proved it.
learn_fix_after_failure = "at_once"
learn_demo_hint = "at_once"
learn_demo_alone_after_times = 2
learn_demo_alone_after_proven_runs = 1
# Use what Yuki learned from how you work (report 78 phase C5): the ways it learned from what you did
# and from your fixes, your usual buttons and shortcuts, and your usual paths.  false = Yuki works as
# it did before it learned from your actions (nothing is deleted).  Read at once, no restart.
use_learned = true
# The hard game gate: while any of these programs is in front (windowed or full screen, the launch
# screen too), nothing about your input is recorded and no card is shown; cards come back 2 minutes
# after you leave the game (the [nudges] return_hold_s below).  With a game in the background the
# trace and cards may run, but the trace never reads or hooks the game's own windows.  While a game
# is in front, Yuki's keys, clicks, pointer moves, focus and window changes, links and app launches
# are refused, and so is any of them aimed at a game's window ("pause" and "next" still work: they
# go through Windows' media controls, not keys).  Not covered yet: a PowerShell step the assistant
# writes itself, and Yuki's own window when you ask for it.  Heavy background work still waits while
# a game runs anywhere.  These are games with kernel anti-cheat.
# Add your own; the ones listed here always count, even if removed from your copy (Yuki also reads
# its own list).  A program Windows detects as a game, or one seen in Direct3D exclusive full screen,
# counts by itself.  Anti-cheat services are not listed: Vanguard's tray (vgtray.exe) runs all the
# time and is not a game.
# game_gate = "running" brings back the older, stricter rule: nothing is recorded while a game runs
# anywhere, in front or not (any other value means "front").
game_gate = "front"
game_processes = [
    "VALORANT-Win64-Shipping.exe", "VALORANT.exe",
    "League of Legends.exe",
    "FortniteClient-Win64-Shipping.exe",
    "r5apex.exe", "r5apex_dx12.exe",
    "TslGame.exe",
    "RainbowSix.exe", "RainbowSix_BE.exe",
    "cod.exe",
    "GenshinImpact.exe", "YuanShen.exe", "StarRail.exe", "ZenlessZoneZero.exe",
    "destiny2.exe",
    "EscapeFromTarkov.exe",
    "RustClient.exe",
    "DeadByDaylight-Win64-Shipping.exe",
    "eldenring.exe",
    "bf2042.exe",
    "Marvel-Win64-Shipping.exe",
]

[meetings]
# Meetings are remembered as hours only: the timeline records a "meeting"
# row with the app or site, its name and start/end (plus how long the app
# used the microphone) - never a window title, a page path, or anything said
# or shown.  Their content stays blocked by [apps] and [web] above.
# What a meeting is, is measured, not listed: the app in front has held the
# microphone (or, with camera = true, the camera) for hold_s seconds - Windows'
# own record of who uses them.  For a browser, the meeting is the site that
# was in front when it took the microphone.  It ends end_grace_s seconds after
# the app lets go.
hold_s = 20
end_grace_s = 30
camera = true
# Your own overrides (empty by default): apps (process names) and sites that
# are meetings whenever they are in front, and ones that never are (a voice
# recorder, a music app).
always_apps = []
always_sites = []
never_apps = []
never_sites = []
# (processes, host_suffixes and host_paths - a list of meeting apps and sites -
# are no longer read.)

# Optional display names (process or host -> name), e.g. "meet.google.com" =
# "Google Meet".  Default: the app's own name, or the site.
[meetings.names]

[terminal]
# The Warp terminal's command history (its own local database, read-only).
# Every few minutes the new commands are journaled: the command line, its
# folder, git branch, exit code and time.  Command OUTPUT is never read.
# A command that holds a secret is dropped entirely (never stored, never sent
# to the model): a key, token or private key in its vendor's published format,
# a URL with a password, an Authorization header, a card number (the same
# fixed-format detector as the rest of memory).  A password passed as a flag
# (mysql -pX, --password X) is no fixed format and is NOT caught.  Set
# enabled = false to stop reading Warp's history.
enabled = true
# Path of Warp's database; empty = %LOCALAPPDATA%\warp\Warp\data\warp.sqlite.
database = ""
# Commands Warp's own AI agent ran (not typed by you) are journaled too, marked as such.
include_agent_commands = true
# (secret_patterns, a list of regular expressions, is no longer read.)

# Long random-looking words are treated as secrets too: a word (split at
# spaces, quotes, = : , ; ( ) < > | & / \) at least this long whose characters
# carry at least this many bits of entropy each, mixing letters and digits.
# (A git commit hash or a GUID on the command line is dropped by this.)
entropy_min_length = 24
entropy_min_bits = 3.5

[nudges]
# The coach (yuki.memory.nudges): a well-timed break nudge after a long session,
# rarely a call-back when work has turned into something else for a while, one
# welcome back when you return, and reminders of to-dos that are due.  No praise.
# What to say is the model's call; these are only when it may speak.  (Not privacy rules, but they live here so all
# of memory's knobs are in one file.)  A missing key keeps its default.
enabled = true
# Local quiet hours: nothing at all between these times (wraps midnight).
quiet_start = "00:30"
quiet_end = "08:00"
# At most one nudge or welcome back per this many minutes (reminders are exempt).
budget_min = 30
# A routine look this often while you are at the PC (the coach also looks when a
# long session gives way to another, when something you finished lands in the
# journal, and at the first calm moment after a game).  The welcome back waits
# until you have settled into something for transition_hold_s.
periodic_min = 15
transition_hold_s = 90
# Sessions: a hop to another app shorter than this stays part of the session it
# interrupts (an hour of a game with 3-5 minute hops to a chat is one session).
session_excursion_min = 5
# No look at all before you have been at the PC this long; a break nudge goes at
# most once per session and break_gap_min apart.
break_consider_min = 45
break_gap_min = 60
# A call-back only once a new session has held this long, with journal facts about it.
callback_after_min = 15
# Cards (nudges, the welcome back, questions, a call plan's reminder offer) at
# least this far apart; a to-do due at an exact time is reminded on time.
card_gap_min = 10
# A plan you said on a call is offered as a reminder only while its moment is at
# least this far ahead.
confirm_lead_min = 30
# After a meeting, it is held open while its app still plays sound (Meet drops
# the microphone on mute), for at most this many minutes after the microphone.
meeting_hold_min = 30
# No card while a game or a full-screen app is in front; cards come back this many
# seconds after you leave it (an alt-tab between rounds is still the game).
return_hold_s = 120
# Model calls at least this far apart, and at most this many per hour.
min_gap_s = 90
max_calls_per_hour = 12
# "At the PC" = active or watching within this many minutes.
presence_min = 5
# How far back the coach looks, and what counts as a break.
lookback_min = 120
break_min = 5
# A praise or nudge not shown within this many minutes is dropped (reminders are kept).
deliver_within_min = 15
# A reminder more than this many hours late is not sent.
reminder_late_max_h = 24
# A to-do due on a day without a time is reminded at this time that day.
all_day_at = "09:00"
# Picking up after the PC was off or asleep: one short message once you have
# settled in, when the PC was off or asleep at least resume_after_h hours, or
# at your first time at the PC on a new day (days start at resume_day_start).
# Not sent during a call, a meeting or full screen: it waits for a calm moment
# within resume_within_min minutes of your return, else it is skipped.
resume_enabled = true
resume_after_h = 3
resume_day_start = "04:00"
resume_within_min = 60
# What it may draw on: your last this-many minutes at the PC before the gap.
resume_before_min = 90
# Getting to know you: when memory sees something it cannot make sense of without
# guessing (who someone is to you, what a name is, whose task something is), it
# asks you on a "Getting to know you" card instead - the most important first, at
# a calm moment (not in a call, a meeting, full screen, quiet hours or a snooze),
# at most one per question_gap_min minutes of your time at the PC (counted from
# the last question or from when you sat down) and questions_per_day a day, only of
# importance question_min_importance (1-10) or more, and only about what memory
# saw in the last question_max_age_days days.
questions_enabled = true
question_gap_min = 20
questions_per_day = 6
question_min_importance = 5
question_max_age_days = 7
# What a card may offer.  "yuki_only": now and then one small thing of Yuki's
# own, run by code the moment you press its button, never by the agent - add it
# to your list, show what Yuki has on it, open again a page you had, a draft
# to copy, or a suggestion put unsent in the ask bar - never your own work.
# "off": cards only tell you things; no button runs anything.
offers = "yuki_only"
# The routine card ("Your usual", yuki.memory.routine_offers): when a skill Yuki learned from you has a usual time
# (a weekday meeting tab at 08:58), one card in its window offers to run it: from routine_lead_min to
# routine_lead_last_min minutes before the usual time; its button expires routine_expire_after_min minutes after it;
# once you sat down it waits routine_settle_s seconds; at most routine_per_day a day.  Code only, no model; it never
# sends a message or joins a call (you click Join), and never shows over a game, a call, quiet hours or a snooze.
# offers = "off" stops it too.
routine_offers = true
routine_per_day = 2
routine_lead_min = 8
routine_lead_last_min = 1
routine_expire_after_min = 10
routine_settle_s = 30

[review]
# The weekly review (yuki.memory.review): the last seven days in numbers and a
# short narrative, written once a week and delivered as a "review" card.  (Not
# privacy rules either; a missing key keeps its default.)
enabled = true
# The weekly slot: the review runs at the first moment after it that you have
# been idle for idle_min minutes (or when memory next starts, if it was not running).
weekday = "sunday"
at = "20:00"
idle_min = 5
# A slot missed while memory was not running is caught up only this many hours late at most.
catch_up_h = 36
# The card waits until you are at the PC (input within present_s seconds),
# outside the [nudges] quiet hours and snooze, for at most deliver_within_h hours.
present_s = 120
deliver_within_h = 72
# A failed run is retried no sooner than this many minutes later.
retry_min = 30

[moments]
# Moments (yuki.memory.moments, phase F): one table of what changed - you joined a call, music
# started, a page you stayed on, a volume you moved, a message you sent - so Yuki can learn your
# usual moments.  Derived again from what memory already keeps whenever its rules change; never
# shown to other apps (not in the MCP).  false = none are written, and the volume watcher and the
# Spotify reader below (they only feed moments) do not start (read when memory starts).
enabled = true
# Volume changes (the system volume and each app's mixer level, from Windows' own audio events).
volume_events = true
# Media titles are never kept, only a keyed digest; true keeps the title encrypted (never for an
# app that was private in the last 10 minutes).
media_titles = false
# How often the derived moments are brought up to date (seconds; sooner after a call starts or ends).
refresh_s = 60
# A web page counts as a moment once you stayed on it this long (seconds), or when it matches a
# site's known page shape (a YouTube video, a channel).
page_dwell_s = 300
# A site with no known page shape counts as a moment once you stayed on it this long (seconds): one moment per site,
# never its page's title or address (the skill learner reads these for your usual sites).
host_dwell_s = 60
# Moments older than this many days are deleted.
keep_days = 90

[spotify]
# Spotify's own desktop window, read through UI Automation: no account, key or sign-in (PLAN.md D0, D4).
enabled = true
# Q10: when Spotify's music starts, read its Library for the playing row and the playlist links on screen.
# Names and links are kept encrypted, never logged, never read with a game in front.
library_reads = true
read_budget_s = 0.3
warm_budget_s = 3.0
# Once a day per window state (covered, on another screen, minimised), one counts-only read. Off once S-1 settled them.
state_probe = true

[you]
# The one "you right now" record (yuki.memory.younow): what just changed, what you're working on, whether you're at
# the PC, in a game, on a call or in a meeting. Kept in memory's RAM only (never written to disk, never in the MCP),
# rebuilt only when something in it changed; read by the card judge. false = it isn't built, and the judge then holds
# every card (read again while memory runs).
enabled = true

[judge]
# The one card judge (yuki.memory.cardjudge): every card idea in one pile, one set of holds (game, call, meeting,
# away, quiet hours), shown only at a natural pause, the things that can wait gathered into one "Today" card when you
# first sit down after your night. "shadow" (this release): the old card makers still show the cards; the judge only
# notes what it would have shown (no model call, no card, content-free log) so its choices can be checked before it
# goes live. "off" = not run at all. "on" comes with a later release (until then it acts as "shadow").
mode = "shadow"
# false = no Today card: the morning check-in becomes an ordinary card and Today-only items are dropped.
digest = true

[calls]
# Calls, both sides (yuki.memory.calls; your decision of 3 Oct 2026 - from
# 24 Sept to 3 Oct only your own microphone was recorded).  If you say yes on
# the card, Yuki records during a call, on this PC only: your microphone
# (headphones only) AND the call app's own sound - the other people - through
# Windows "process loopback", which takes the sound of that one app and
# nothing else (never your game, your music or Yuki's own voice).  For a
# browser call that is every tab of that browser.  The audio is kept
# encrypted, turned into text later when the PC is free, then deleted; no
# audio leaves this PC and none is ever written unencrypted.  Every line of
# text says who spoke (you, or the others) and in which app, and each of your
# lines which apps were taking your microphone at that moment.  It remembers
# what was said: facts, decisions and what you said you would do.  It asks
# every call unless you chose "Always" or "Never" for that app; your earlier
# "Always" answers still stand; no answer means nothing is recorded.
enabled = true
# Also record the other side: the call app's own sound (process loopback, one
# track per app).  false = only your own microphone, as before 3 Oct.
record_others = true
# A full-screen game's own voice chat (VALORANT and the like, measured: the
# full-screen app in front holding the microphone and drawing like a game) is
# recorded as its own track, labelled with the game, so a reply to your
# teammates is never taken for talk to the people on a Discord call.  It is
# asked like a call ("Always/Never for <game>"); the card cannot show over a
# full-screen game, so it comes up the first moment it can be seen (the game
# not in front, or right after the session), and recording starts from your
# answer.  false = a game's voice chat is never recorded (and never a call).
game_voice = true
# One of your lines counts as heard by an app when that app was taking the
# microphone over at least this share of it (Windows' audio sessions say when;
# a push-to-talk game may take it only while the key is down).
heard_by_overlap = 0.3
# An app's sound that could not be opened is tried again after this many seconds.
track_retry_s = 300
# During a game's voice chat your microphone is kept only while the game is in
# use: its window in front, or (while it runs) it holding the microphone, or
# its own microphone stream open within this many seconds (push-to-talk just
# released).  A closed game stops it at once; a call you did not say yes to
# that holds the microphone stops it too.
game_mic_grace_s = 3
# What a call is, is measured, not listed: an app (any app, a browser too) that
# holds the microphone while a screen of it, read during that hold, shows a
# joined call (judged by a small model from the window's control names; a
# lobby, a video page or a text chat is not a call).  The card still asks
# every time; "Never for <app>" is remembered.
# A meeting site this file keeps unread ([web] above: meet.google.com,
# zoom.us, Teams' meeting paths) is never read, so its screen cannot be
# judged: a browser holding the microphone while it shows such a page counts
# by the page's site alone (never its title, address path or content).  Which
# blocked sites are meeting services is judged once from the shipped list,
# never from a page you visited; a site you block yourself counts only if you
# also list it in [meetings] always_sites.
# Your own additions (empty by default): apps that are a call whenever they
# hold the microphone, sound or not.  Process names of desktop apps, or
# package family names of Store apps.
apps = []
# Once a call has started, its microphone hold is the session: it goes on
# while the app holds the microphone (a new hold by the same app inside the
# call is the same call), for release_grace_s seconds after it lets go, or
# while a screen of the call shown after it let go is at most screen_alive_s
# old (Meet drops the microphone on mute).  The screen ends a call whose
# microphone is still held only after neg_frames clear "not in a call"
# screens over at least neg_span_s seconds; one screen never does.  A call
# that is not alive for end_grace_s ends.
release_grace_s = 90
neg_frames = 3
neg_span_s = 120
screen_alive_s = 900
# How often the call worker wakes (the microphone's users are read again only
# when Windows changes them).
poll_s = 5
end_grace_s = 30
# The card goes away unanswered after this long (= no recording for this call).
ask_timeout_s = 120
# Your microphone is recorded with headphones only, so the other people's
# voices coming out of speakers never land on your track (their own track,
# taken from the call app, needs no headphones).  The default output device's form factor must be one of
# these (Windows' own values: headphones, headset, handset, speakers,
# line_level, digital_display, spdif, network, unknown).
headphone_form_factors = ["headphones", "headset", "handset"]
# Output devices you know are headphones although Windows does not say so -
# e.g. headphones plugged into an audio interface whose output Windows calls
# "Speakers".  Exact device names as Windows shows them (Sound settings).
headphone_devices = []
# The microphone recorded: the input device the call app itself is recording
# from (Windows' audio sessions tell), else the default communications input.
# Set a device name here to always use that one instead.  Capture is shared
# mode only, so it never takes the microphone away from the call app, Handy
# or anything else.
capture_device = ""
# How often the microphone's users are read again without a change notice
# from Windows (the ConsentStore key is watched; this is only a backstop).
holders_backstop_s = 60
# Speech to text, on this PC only, and never during a call: the speech of
# every track is kept encrypted in the spool (next to the database) until the PC
# is free, then transcribed in a below-normal process that exits after the
# batch (model, RAM and VRAM freed at once).  "faster-whisper:<model>": a Whisper model
# (tried on the GPU with CUDA, int8), with call_stt_fallback on the CPU when
# CUDA is not there or fails.  large-v3 is the default because it gets
# Kannada and Telugu right where large-v3-turbo (faster, 1.2 GB less VRAM)
# mistakes them for Tamil (measured 2026-09-24); use turbo if you only speak
# English and Hindi.
call_stt_model = "faster-whisper:large-v3"
call_stt_fallback = "faster-whisper:small"
# Where models are kept; empty = %LOCALAPPDATA%\Yuki\models\whisper.
model_dir = ""
# Languages you speak in calls (Whisper codes).  Each chunk is transcribed in
# the most likely of these; code-mixed speech ("Hinglish") comes out in the
# chunk's main language.  Empty = any language.
languages = ["en", "hi", "kn", "ta", "te"]
# Speech gate: 32 ms frames under gate_dbfs are silence (no model runs on
# them); louder ones are speech only when Silero VAD (1.2 MB, CPU, one
# thread; ~0.3% of one core while sound comes in) gives at least
# vad_threshold.  A chunk with less speech than min_speech_s is dropped,
# never kept.  vad = false falls back to the energy gate alone.  Chunks are cut at a
# pause once they are chunk_min_s long, and at chunk_max_s at the latest.
gate_dbfs = -50.0
vad = true
vad_threshold = 0.5
min_speech_s = 0.5
chunk_min_s = 6
chunk_max_s = 25
pause_s = 0.7
# The deferred transcription runs only when ALL of these hold: no call is
# going on; nothing full screen in front (the timeline's fact, or Windows
# saying a game or presentation is up); for defer_gpu_quiet_min minutes the
# GPU averaged at or under defer_gpu_max_util % (no sample over defer_gpu_spike_util)
# and kept defer_vram_free_mb free
# (VRAM counts: a game left open holds it even when idle), and the CPU stayed
# under defer_cpu_max_percent on average. Then it runs if you are away (no input for
# defer_idle_min minutes, or the session is locked), if it is night (defer_night,
# local time), or, with defer_when_present, while you are at the PC ("process it when
# no GPU is being used"). It stops after the chunk in hand when a call or a game starts
# (full screen, or other programs using more than defer_gpu_others_max_util % of the GPU
# on average over defer_others_window_s, or leaving under defer_vram_min_free_running_mb
# of VRAM), or memory is paused. Without defer_when_present it also stops when you come
# back (input within defer_back_idle_s; not at night); with it, it carries on.
defer_check_s = 60
defer_idle_min = 5
defer_night = ["01:00", "07:00"]
defer_gpu_max_util = 25      # average % over the quiet window (the desktop alone is 4-18 %)
defer_gpu_spike_util = 60    # and no single sample above this
defer_gpu_quiet_min = 3
defer_vram_free_mb = 2500
defer_cpu_max_percent = 75   # average %; the worker is on the GPU at below-normal priority
defer_back_idle_s = 20
defer_when_present = true
defer_during_calls = true   # also while a call is open, if nothing is full screen and the GPU is quiet
defer_gpu_others_max_util = 25
defer_others_window_s = 30
defer_vram_min_free_running_mb = 300
# Audio never waits longer than this (days), and the spool never grows past
# this (MB, ~11 MB per hour of speech); past either the oldest is deleted.
spool_max_age_days = 7
spool_max_mb = 500
# How the deferred worker turns speech into text (measured 2026-09-25 on synthetic
# speech and noise; docs/MEMORY.md "Calls: both sides").  Each chunk's language
# is detected first and the chunk decoded once, beam stt_beam_size, never
# conditioned on the previous chunk's text.  Whisper retries a decode hotter
# (stt_temperatures) when its text compresses too well (a loop) or its average
# log-probability is too low; each decode may write at most stt_tokens_per_s x
# the chunk's seconds, and no new decode starts after stt_chunk_limit_s +
# stt_chunk_limit_rtf x the chunk's seconds (what was decoded is kept).
stt_beam_size = 5
stt_temperatures = [0.0, 0.4, 0.8]
stt_compression_ratio_threshold = 2.4
stt_log_prob_threshold = -1.0
stt_no_speech_threshold = 0.6
stt_chunk_limit_s = 10
stt_chunk_limit_rtf = 1.0
# What is kept, from Whisper's own probabilities: a segment is dropped when its
# no-speech probability is over stt_drop_no_speech while its average
# log-probability is under stt_drop_log_prob, or when it still compresses over
# the ratio above; it is marked unclear for the journal under
# stt_unclear_log_prob or over stt_unclear_no_speech, and an unclear exact
# repeat of the previous segment of at most stt_repeat_max_tokens tokens is
# dropped (Whisper's loop on breathing, clicks and game sound).
stt_drop_no_speech = 0.2
stt_drop_log_prob = -0.8
stt_unclear_log_prob = -0.6
stt_unclear_no_speech = 0.4
stt_repeat_max_tokens = 12
# Names and terms from memory (portrait, conversation facts, the journal of the
# last stt_vocab_days days) that Whisper does not know as one word, given to it
# as a hint of at most stt_vocab_tokens tokens (0 = no hint).
stt_vocab_tokens = 40
stt_vocab_days = 14
# Only for these languages: the names are in Latin script, and with them in the
# prompt Whisper translated Kannada speech into English (measured).
stt_vocab_languages = ["en", "hi"]
# Optional display names for the card (process name -> name).  Default: the
# app's own name (its file description, e.g. "Discord", "Google Chrome").
[calls.names]

# Upper bound of Whisper tokens per second of audio, per language: ~2x what
# synthetic speech needs (en 4, hi 14, ta 13, kn 30, te 25 tokens/s; Indian
# scripts cost many tokens).  A decode stuck in a loop stops there.
[calls.stt_tokens_per_s]
en = 8
hi = 28
ta = 26
kn = 60
te = 52

# A style example per language, given to Whisper as the text before the chunk.
# Written the way you speak, it makes Whisper write the same way: Hindi with the
# English words in Latin script ("meeting", "busy") instead of transliterated
# into Devanagari ("मीटिंग").  Keep it short and free of names.
[calls.stt_prompts]
hi = "हाँ यार, meeting के बाद call करता हूँ, अभी थोड़ा busy हूँ, the build is failing."
