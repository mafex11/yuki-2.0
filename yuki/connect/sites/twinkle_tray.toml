# Twinkle Tray as data (morning21 lane B: B5, B6): a monitor app, one possible means of the display capability
# (yuki/skills/connections/display.toml, means = "app"). Facts true for anyone's Twinkle Tray, from its README (v1.13+)
# and its source (src/electron.js, handleCommandLine and handleClientMessage; src/Utils.js; read 22 Oct, mon1, from
# its app.asar as text); whether *this* user uses it is told or learned, never written here, and nothing about it is
# ever required (Windows' own DDC/CI always works without it).
#
# Zero setup (D0): its command line, handed to the running app, and its named pipe's read-only list; never its UDP
# interface (off by default and keyed: that would be setup) and never its panel (an Electron flyout that closes when it
# loses focus).
#
# What it can reach (mon1, its source): every path of it (flyout, command line, pipe) writes DDC/CI through the
# physical-monitor handle of a monitor Windows lists now, the same way Yuki's own control does. Its live list is
# rebuilt at each full refresh (5 s after a display change), so a monitor Windows dropped leaves it too: it can't wake
# a monitor that is no longer attached.

[app]
name = "Twinkle Tray"
# What it controls: the display driver (yuki/skills/display_route.py) reads every app data file that says so.
controls = "monitors"
# The program that runs it, in both install forms (the Store package and the classic installer).
images = ["Twinkle Tray.exe"]
store_package_name = "38002AlexanderFrangos.TwinkleTray"
# How its command line is reached: the Store build's App Execution Alias (in %LOCALAPPDATA%\Microsoft\WindowsApps),
# else the classic install's program. Environment variables are expanded; the first that exists is run.
programs = ["%LOCALAPPDATA%\\Microsoft\\WindowsApps\\Twinkle-Tray.exe",
            "%LOCALAPPDATA%\\Programs\\twinkle-tray\\Twinkle Tray.exe"]

[cli]
# The command line reaches the running app only: started cold it does nothing, so Yuki asks rather than run it.
needs_running = true
# It prints nothing and its exit status says nothing: every change is read back from the monitor (DDC/CI).
exit_works = false
# One monitor by its own key in the app's list: the app lower-cases the argument and takes the first key of its list
# that contains it. Its keys are each monitor's Plug and Play instance part ("5&19123132&0&uid155906": the README's
# "UID2353" form, and what its pipe's list is keyed by), never the Plug and Play id: "acr06d7" matches no key and the
# app does nothing (mon1: the morning21 data said it worked; it never ran on this PC). The whole instance part is given,
# but one monitor's can still stand inside another's ("...&uid1" in "...&uid12"), and the instance part is the port's,
# not the monitor's (another monitor on that port has the same key): so the driver runs it only when exactly one key of
# the pipe's list contains it and that entry is the same monitor (its Plug and Play id, [pipe] pnp below).
select = "--MonitorID={instance}"
# A brightness level, 0-100 (applied to the selected monitor).
set = "--Set={level}"
# Any VCP code and value ("--VCP=0xD6:1" wakes a monitor; written without quotes: the app strips none).
vcp = "--VCP={code}:{value}"
# --MonitorNum=N is a place in the app's own list (neither Windows' numbering nor Yuki's): never used.
positional_select = "never"
# --List handed to the running app does nothing (its own handler is empty); a second instance's --List asks the pipe
# below and prints a console listing. Yuki reads the pipe itself (no console).
list_works = false

[pipe]
# Its named pipe (zero setup: no key) answers {"type":"list"} with its live monitor list: a JSON object keyed by each
# monitor's instance part (the select key above). Read only: the display driver sends this one request, to learn
# whether the app can reach a monitor before running its command line for it, and nothing else.
path = '\\.\pipe\twinkle-tray\cmds'
list = '{"type":"list"}'
# Where each entry of the list gives the monitor's Plug and Play id: its "hwid" ("\\?\DISPLAY", "AOP069C", the instance
# part, ...), item 1 (Monitors.js builds it from the device path).
pnp = "hwid.1"
