[project]
name = "yuki"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]>=1.7.0",
    "boto3>=1.43.99",
    "comtypes>=1.4.17",
    "cryptography>=50.0.1",
    "fastembed>=0.8.1",
    "faster-whisper>=1.2.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "livekit==1.1.20",
    "pipecat-ai[anthropic,deepgram,elevenlabs]==1.11.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pyside6>=6.11.2",
    # The official WebView2Loader.dll for the HTML window (yuki.ui.webview2 locates it in this package; none of
    # pywebview's own code is imported, so pythonnet/.NET never load). Phase E2, 2026-10-03.
    "pywebview>=6.2.1",
    "pywin32>=312",
    "rich>=15.0.0",
    "sentencepiece>=0.2.1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5.6",
    "uiautomation>=2.0.29",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-media-control>=3.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# The Windows app build (packaging/build.ps1, .github/workflows/build.yml): `uv sync --group build`.
build = [
    "pyinstaller>=6.16",
]

[project.scripts]
yuki = "yuki.cli:main"
yuki-ui = "yuki.ui.app:main"
yuki-memory = "yuki.memory.service:main"
yuki-mcp = "yuki.mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes a real Bedrock API call (costs money); run explicitly"]
addopts = "-m 'not live'"

[tool.uv]
# pipecat-ai 1.11 pins onnxruntime~=1.24.3 for its own Silero/Smart Turn helpers,
# which Yuki's voice layer does not use (Deepgram Flux does turn detection).
# The memory service already runs onnxruntime 1.30 (Silero VAD, fastembed), and
# a downgrade under a running service would swap DLLs it has loaded.
override-dependencies = ["onnxruntime>=1.30.0"]

[tool.uv.build-backend]
module-root = ""
module-name = "yuki"
