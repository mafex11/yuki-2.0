[project]
name = "yuki"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]>=1.7.0",
    "boto3>=1.43.99",
    "comtypes>=1.4.17",
    "cryptography>=50.0.1",
    "fastembed>=0.8.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pyside6>=6.11.2",
    "pywin32>=312",
    "rich>=15.0.0",
    "uiautomation>=2.0.29",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-media-control>=3.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
yuki = "yuki.cli:main"
yuki-ui = "yuki.ui.app:main"
yuki-memory = "yuki.memory.service:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes a real Bedrock API call (costs money); run explicitly"]
addopts = "-m 'not live'"

[tool.uv.build-backend]
module-root = ""
module-name = "yuki"
